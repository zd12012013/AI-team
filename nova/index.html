<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NOVA — школьная программа Казахстана</title>
<meta name="description" content="NOVA: темы школьной программы РК с 5 по 11 класс, тесты четырёх уровней сложности, прогресс, слабые темы и AI-помощник «Объясни ошибку».">
<meta name="theme-color" content="#22A06B">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✦</text></svg>">
<style>
/* =====================================================================
   1. ПЕРЕМЕННЫЕ И БАЗА (светлая тема, основной цвет — зелёный)
   ===================================================================== */
:root {
  --bg: #f5f7f6;
  --bg-2: #eef2f0;
  --card: #ffffff;
  --card-2: #f3f6f4;
  --line: #e1e7e4;
  --text: #17231e;
  --muted: #5d6b65;
  --accent: #22A06B;
  --accent-dark: #1a7f55;
  --accent-light: #e6f5ee;
  --accent-2: #4fc79a;
  --ok: #1f9d63;
  --warn: #c27a00;
  --warn-bg: #fff4dc;
  --danger: #d64550;
  --danger-bg: #fdecee;
  --radius: 18px;
  --radius-sm: 12px;
  --shadow: 0 6px 20px rgba(23, 35, 30, .06);
  --shadow-hover: 0 12px 28px rgba(23, 35, 30, .12);
  --ease: cubic-bezier(.2, .8, .2, 1);
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; min-height: 100vh;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  color: var(--text); line-height: 1.5; background: var(--bg);
}
h1, h2, h3, h4 { margin: 0 0 .5em; line-height: 1.2; letter-spacing: -.01em; }
p { margin: 0 0 .8em; }
a { color: var(--accent-dark); }
button, input, select, textarea { font: inherit; color: inherit; }
.muted { color: var(--muted); }
.small { font-size: .85rem; }
.hidden { display: none !important; }
:focus-visible { outline: 3px solid rgba(34, 160, 107, .45); outline-offset: 2px; }
.wrap { max-width: 1080px; margin: 0 auto; padding: 0 16px; }

/* =====================================================================
   2. ШАПКА
   ===================================================================== */
.topbar { position: sticky; top: 0; z-index: 20; background: rgba(255, 255, 255, .92); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
.topbar .wrap { display: flex; align-items: center; justify-content: space-between; gap: 10px; height: 62px; }
.logo { display: flex; flex-direction: column; text-decoration: none; color: var(--text); }
.logo b { font-size: 1.3rem; letter-spacing: .06em; font-weight: 800; }
.logo b span { color: var(--accent); display: inline-block; transition: transform .6s var(--ease); }
.logo:hover b span { transform: rotate(180deg) scale(1.15); }
.logo small { white-space: nowrap; font-size: .6rem; letter-spacing: .2em; color: var(--muted); font-weight: 700; }
.top-nav { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
.top-nav a { flex: none; text-decoration: none; color: var(--muted); font-size: .88rem; font-weight: 600; padding: 8px 10px; border-radius: 999px; transition: background .2s, color .2s; }
.top-nav a:hover { color: var(--text); background: var(--bg-2); }
.top-nav a.active { color: var(--accent-dark); background: var(--accent-light); }
.top-nav .lbl { display: none; }

/* =====================================================================
   3. ОБЩИЕ КОМПОНЕНТЫ
   ===================================================================== */
main { padding: 18px 0 70px; }
.view { animation: viewIn .4s var(--ease); }
@keyframes viewIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; margin-bottom: 16px; box-shadow: var(--shadow); }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  border: 1px solid var(--line); background: var(--card); color: var(--text);
  padding: 11px 16px; border-radius: var(--radius-sm); cursor: pointer; font-weight: 650;
  text-decoration: none; transition: transform .15s var(--ease), background .2s, border-color .2s, box-shadow .2s;
}
.btn:hover { border-color: #c5d2cc; transform: translateY(-1px); box-shadow: var(--shadow); }
.btn:active { transform: scale(.97); }
.btn:disabled { opacity: .45; cursor: not-allowed; transform: none; box-shadow: none; }
.btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn-primary:hover { background: var(--accent-dark); border-color: var(--accent-dark); }
.btn-soft { background: var(--accent-light); border-color: transparent; color: var(--accent-dark); }
.btn-ghost { background: transparent; box-shadow: none; }
.btn-danger { color: var(--danger); }
.btn-sm { padding: 7px 11px; font-size: .85rem; border-radius: 10px; }
.btn-block { width: 100%; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.row.between { justify-content: space-between; }
label.field { display: block; margin-bottom: 12px; }
label.field > span { display: block; font-size: .82rem; color: var(--muted); margin-bottom: 6px; font-weight: 650; }
input[type=text], input[type=search], input[type=password], input[type=datetime-local], select, textarea {
  width: 100%; background: #fff; border: 1.5px solid var(--line); border-radius: var(--radius-sm);
  padding: 11px 13px; transition: border-color .2s, box-shadow .2s;
}
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(34, 160, 107, .18); }
textarea { resize: vertical; min-height: 70px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: .78rem; font-weight: 650; padding: 4px 10px; border-radius: 999px; background: var(--card-2); border: 1px solid var(--line); color: var(--muted); }
button.chip { cursor: pointer; transition: all .2s; }
button.chip:hover { color: var(--text); }
button.chip.active, .chip.on { background: var(--accent-light); border-color: var(--accent); color: var(--accent-dark); }
.seg { display: inline-flex; background: var(--bg-2); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
.seg button { border: 0; background: transparent; padding: 7px 13px; border-radius: 999px; cursor: pointer; color: var(--muted); font-weight: 650; font-size: .85rem; transition: all .2s; }
.seg button.active { background: #fff; color: var(--accent-dark); box-shadow: var(--shadow); }
.empty { text-align: center; padding: 34px 18px; border: 1.5px dashed #cfdad5; border-radius: var(--radius); color: var(--muted); background: #fbfcfc; }
.empty .e-icon { font-size: 2.3rem; display: block; margin-bottom: 8px; }
.empty b { color: var(--text); display: block; margin-bottom: 4px; }
.progress { height: 8px; background: var(--bg-2); border-radius: 999px; overflow: hidden; }
.progress > i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-2)); border-radius: inherit; transition: width .6s var(--ease); }
.badge-check { font-size: .72rem; font-weight: 700; color: var(--warn); background: var(--warn-bg); border-radius: 999px; padding: 2px 8px; white-space: nowrap; }
.pct { font-weight: 800; }
.pct.good { color: var(--ok); } .pct.mid { color: var(--warn); } .pct.bad { color: var(--danger); }

.mod-head { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
.back { width: 42px; height: 42px; flex: none; display: grid; place-items: center; border-radius: 12px; background: var(--card); border: 1px solid var(--line); color: var(--text); text-decoration: none; font-size: 1.2rem; transition: transform .2s var(--ease), border-color .2s; }
.back:hover { transform: translateX(-3px); border-color: var(--accent); }
.mod-head h1 { margin: 0; font-size: 1.4rem; }
.mod-head p { margin: 0; color: var(--muted); font-size: .9rem; }
.crumbs { display: flex; flex-wrap: wrap; gap: 4px; font-size: .82rem; margin-bottom: 8px; color: var(--muted); }
.crumbs a { color: var(--muted); text-decoration: none; }
.crumbs a:hover { color: var(--accent-dark); text-decoration: underline; }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px); opacity: 0; background: var(--text); color: #fff; padding: 12px 18px; border-radius: 14px; box-shadow: var(--shadow-hover); transition: all .3s var(--ease); pointer-events: none; z-index: 70; font-weight: 600; max-width: calc(100% - 32px); text-align: center; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* =====================================================================
   4. ГЛАВНАЯ
   ===================================================================== */
.hero { padding: 10px 0 4px; }
.hero .eyebrow { font-size: .72rem; letter-spacing: .2em; color: var(--accent-dark); font-weight: 800; margin-bottom: 8px; }
.hero h1 { font-size: clamp(1.9rem, 6.5vw, 3rem); font-weight: 850; margin-bottom: 10px; }
.hero h1 em { font-style: normal; color: var(--accent); }
.hero p { color: var(--muted); max-width: 560px; }
.stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin: 16px 0 22px; }
.stat { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; box-shadow: var(--shadow); }
.stat b { display: block; font-size: 1.45rem; font-weight: 850; color: var(--accent-dark); }
.stat span { font-size: .76rem; color: var(--muted); }
.section-title { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin: 8px 0 12px; }
.section-title h2 { margin: 0; font-size: 1.2rem; }
.subjects { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 24px; }
.subject {
  position: relative; display: flex; flex-direction: column; gap: 6px; padding: 16px; min-height: 132px;
  border-radius: var(--radius); background: var(--card); border: 1px solid var(--line); box-shadow: var(--shadow);
  text-decoration: none; color: var(--text); transition: transform .3s var(--ease), box-shadow .3s, border-color .3s;
}
.subject:hover { transform: translateY(-3px); box-shadow: var(--shadow-hover); border-color: var(--c, var(--accent)); }
.s-icon { width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; font-size: 1.5rem; background: color-mix(in srgb, var(--c, var(--accent)) 14%, #fff); transition: transform .3s var(--ease); }
.subject:hover .s-icon { transform: scale(1.08) rotate(-5deg); }
.subject b { font-size: 1rem; }
.subject small { color: var(--muted); font-size: .78rem; }
.subject .progress { margin-top: auto; height: 6px; }
.soon { position: absolute; top: 12px; right: 12px; font-size: .68rem; font-weight: 800; color: var(--muted); background: var(--bg-2); padding: 2px 8px; border-radius: 999px; }
.tools { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.tool { display: flex; gap: 10px; align-items: center; padding: 14px; border-radius: 16px; background: var(--card); border: 1px solid var(--line); text-decoration: none; color: var(--text); transition: transform .25s var(--ease), border-color .2s; }
.tool:hover { transform: translateY(-2px); border-color: var(--accent); }
.tool span { font-size: 1.5rem; }
.tool b { display: block; font-size: .95rem; }
.tool small { color: var(--muted); font-size: .76rem; }

/* =====================================================================
   5. ПРЕДМЕТ → КЛАСС → ТЕМА
   ===================================================================== */
.grades { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
.grade {
  display: flex; flex-direction: column; gap: 8px; padding: 18px; border-radius: var(--radius); background: var(--card);
  border: 1px solid var(--line); box-shadow: var(--shadow); text-decoration: none; color: var(--text);
  transition: transform .25s var(--ease), border-color .2s, box-shadow .25s;
}
.grade:hover { transform: translateY(-3px); border-color: var(--accent); box-shadow: var(--shadow-hover); }
.grade .g-num { font-size: 2rem; font-weight: 850; color: var(--accent-dark); line-height: 1; }
.grade small { color: var(--muted); }
.big-progress { display: flex; align-items: center; gap: 12px; }
.big-progress .progress { flex: 1; height: 10px; }
.section { margin-bottom: 18px; }
.section h3 { font-size: .9rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 8px; }
.topics { display: grid; gap: 8px; }
.topic-row {
  display: flex; align-items: center; gap: 12px; padding: 13px 14px; border-radius: 14px; background: var(--card);
  border: 1px solid var(--line); text-decoration: none; color: var(--text); transition: transform .2s var(--ease), border-color .2s, background .2s;
}
.topic-row:hover { transform: translateX(3px); border-color: var(--accent); }
.topic-row.done { background: var(--accent-light); border-color: #bfe5d2; }
.tick { width: 26px; height: 26px; flex: none; border-radius: 50%; display: grid; place-items: center; border: 2px solid #c9d5cf; font-size: .8rem; font-weight: 900; color: #fff; }
.topic-row.done .tick { background: var(--accent); border-color: var(--accent); }
.topic-row .t-name { flex: 1; font-weight: 650; }
.topic-row .t-side { display: flex; align-items: center; gap: 6px; font-size: .8rem; color: var(--muted); }
.explain-card { border-left: 4px solid var(--accent); }
.explain-card p:last-child { margin-bottom: 0; }
.levels { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
.level {
  text-align: left; cursor: pointer; display: flex; flex-direction: column; gap: 4px; padding: 16px; border-radius: var(--radius);
  background: var(--card); border: 1.5px solid var(--line); box-shadow: var(--shadow); transition: transform .25s var(--ease), border-color .2s, box-shadow .2s;
}
.level:hover { transform: translateY(-3px); border-color: var(--lc); box-shadow: var(--shadow-hover); }
.level .l-dot { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; font-weight: 900; color: #fff; background: var(--lc); }
.level b { font-size: 1.02rem; margin-top: 4px; }
.level small { color: var(--muted); }
.level.passed { border-color: var(--accent); background: linear-gradient(180deg, var(--accent-light), #fff 70%); }

/* =====================================================================
   6. ТЕСТ И РЕЗУЛЬТАТ
   ===================================================================== */
.q-top { display: flex; justify-content: space-between; color: var(--muted); font-size: .85rem; margin-bottom: 8px; gap: 10px; }
.question h2 { font-size: 1.15rem; margin: 14px 0 16px; white-space: pre-line; }
.options { display: grid; gap: 8px; }
.option { text-align: left; padding: 13px 15px; border-radius: var(--radius-sm); background: #fff; border: 1.5px solid var(--line); cursor: pointer; transition: all .2s var(--ease); }
.option:hover { border-color: #b9cbc2; transform: translateX(3px); }
.option.picked { border-color: var(--accent); background: var(--accent-light); }
.result-top { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
.ring { --p: 0; width: 116px; height: 116px; border-radius: 50%; display: grid; place-items: center; flex: none; background: conic-gradient(var(--ring-c, var(--accent)) calc(var(--p) * 1%), var(--bg-2) 0); }
.ring > div { width: 90px; height: 90px; border-radius: 50%; background: var(--card); display: grid; place-items: center; font-size: 1.6rem; font-weight: 850; }
.mistake { border-left: 3px solid var(--danger); padding: 10px 12px; background: #fff8f8; border-radius: 0 12px 12px 0; margin-bottom: 10px; }
.mistake p { margin: 4px 0; font-size: .92rem; }
.mistake .bad { color: var(--danger); }
.mistake .good { color: var(--ok); font-weight: 650; }
.weak { display: flex; align-items: center; gap: 10px; justify-content: space-between; padding: 12px 14px; border-radius: 14px; background: var(--warn-bg); border: 1px solid #f3d9a4; margin-bottom: 8px; text-decoration: none; color: var(--text); transition: transform .2s var(--ease); }
.weak:hover { transform: translateX(3px); }
.weak small { color: var(--muted); display: block; }
.hist-item { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.hist-item:last-child { border-bottom: 0; }

/* =====================================================================
   7. AI-ПАНЕЛЬ «ОБЪЯСНИ ОШИБКУ»
   ===================================================================== */
.ai-backdrop { position: fixed; inset: 0; background: rgba(23, 35, 30, .35); opacity: 0; pointer-events: none; transition: opacity .3s; z-index: 40; }
.ai-backdrop.open { opacity: 1; pointer-events: auto; }
.ai-panel {
  position: fixed; z-index: 50; left: 0; right: 0; bottom: 0; height: 88vh; background: #fff;
  border-radius: 22px 22px 0 0; box-shadow: 0 -10px 40px rgba(0, 0, 0, .18);
  display: flex; flex-direction: column; transform: translateY(105%); transition: transform .35s var(--ease);
}
.ai-panel { visibility: hidden; transition: transform .35s var(--ease), visibility .35s; }
.ai-panel.open { transform: none; visibility: visible; }
.ai-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
.ai-head b { display: block; }
.ai-head small { color: var(--muted); font-size: .78rem; }
.ai-mode { font-size: .72rem; font-weight: 800; padding: 3px 9px; border-radius: 999px; background: var(--bg-2); color: var(--muted); }
.ai-mode.on { background: var(--accent-light); color: var(--accent-dark); }
.ai-body { flex: 1; overflow-y: auto; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.ai-ctx { background: var(--card-2); border-radius: 14px; padding: 10px 12px; font-size: .88rem; }
.ai-ctx p { margin: 2px 0; }
.msg { max-width: 92%; padding: 10px 13px; border-radius: 16px; font-size: .94rem; animation: viewIn .3s var(--ease); word-wrap: break-word; }
.msg.bot { background: var(--accent-light); border-bottom-left-radius: 4px; align-self: flex-start; }
.msg.me { background: var(--text); color: #fff; border-bottom-right-radius: 4px; align-self: flex-end; }
.msg ul { margin: 6px 0; padding-left: 20px; }
.msg .sources { margin-top: 8px; padding-top: 8px; border-top: 1px dashed #b8dcca; font-size: .85rem; }
.msg .sources a { display: block; margin: 3px 0; }
.typing span { display: inline-block; width: 7px; height: 7px; margin: 0 2px; border-radius: 50%; background: var(--accent); animation: blink 1s infinite; }
.typing span:nth-child(2) { animation-delay: .2s; } .typing span:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 0%, 100% { opacity: .2; } 50% { opacity: 1; } }
.ai-foot { display: flex; gap: 8px; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); }
.ai-foot input { flex: 1; }
.explain-btn { margin-top: 6px; }

/* =====================================================================
   8. МОДУЛИ HOMETRY, TASKPLANNER, TEAMSYNC
   ===================================================================== */
.ht-grid { display: grid; gap: 12px; }
.ht-card { text-align: left; cursor: pointer; display: flex; gap: 14px; align-items: flex-start; padding: 16px; border-radius: var(--radius); background: var(--card); border: 1px solid var(--line); box-shadow: var(--shadow); transition: transform .25s var(--ease), border-color .2s; }
.ht-card:hover { transform: translateY(-3px); border-color: var(--accent); }
.ht-card .ht-emoji { font-size: 2rem; width: 52px; height: 52px; flex: none; display: grid; place-items: center; background: var(--accent-light); border-radius: 14px; }
.ht-card b { display: block; font-size: 1.05rem; }
.ht-card p { margin: 4px 0 8px; font-size: .88rem; color: var(--muted); }
.explain { font-size: 1.02rem; }
.items { display: grid; gap: 8px; margin-top: 10px; }
.item { display: flex; gap: 10px; align-items: flex-start; background: var(--card-2); border-radius: 12px; padding: 10px 12px; font-size: .92rem; }
.item span:first-child { font-size: 1.3rem; }
.need { list-style: none; padding: 0; margin: 0; display: flex; flex-wrap: wrap; gap: 6px; }
.steps { counter-reset: s; list-style: none; padding: 0; margin: 0; }
.steps li { counter-increment: s; position: relative; padding: 0 0 12px 40px; }
.steps li::before { content: counter(s); position: absolute; left: 0; top: 0; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--accent-light); color: var(--accent-dark); font-weight: 800; font-size: .85rem; }
.conclusion { background: var(--accent-light); border: 1px solid #bfe5d2; border-radius: 16px; padding: 14px 16px; }
.safety { font-size: .85rem; color: var(--warn); margin-top: 10px; }
.form-grid { display: grid; gap: 0 12px; }
.task { display: flex; gap: 12px; align-items: flex-start; padding: 14px; margin-bottom: 10px; background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--line); border-radius: 16px; transition: transform .2s var(--ease), opacity .3s; animation: viewIn .35s var(--ease); }
.task:hover { transform: translateX(2px); }
.task.overdue { border-left-color: var(--danger); background: linear-gradient(90deg, var(--danger-bg), #fff 45%); }
.task.urgent { border-left-color: var(--warn); background: linear-gradient(90deg, var(--warn-bg), #fff 45%); }
.task.done { opacity: .6; border-left-color: var(--ok); }
.task.done .t-title { text-decoration: line-through; }
.check { width: 26px; height: 26px; flex: none; border-radius: 8px; border: 2px solid #b9c7c0; background: #fff; cursor: pointer; display: grid; place-items: center; transition: all .2s; color: #fff; font-weight: 900; font-size: .85rem; }
.check:hover { border-color: var(--ok); }
.task.done .check { background: var(--ok); border-color: var(--ok); }
.t-body { flex: 1; min-width: 0; }
.t-title { font-weight: 700; word-break: break-word; }
.t-meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; font-size: .8rem; }
.t-actions { display: flex; gap: 4px; }
.icon-btn { border: 0; background: transparent; cursor: pointer; padding: 6px; border-radius: 8px; font-size: 1rem; transition: background .2s; }
.icon-btn:hover { background: var(--bg-2); }
.prio-high { color: var(--danger); border-color: #f2b8bd; }

<!-- ================= ШАПКА ================= -->

  <div class="wrap">

      <b><span>✦</span> NOVA</b>
      <small>SMART STUDENT PLATFORM</small>
    </a>
    <nav class="top-nav" aria-label="Разделы">
      <a href="#/" data-nav="">📚<span class="lbl"> Предметы</span></a>

<main class="wrap"><div id="app"></div></main>

<!-- AI-панель «Объясни ошибку» -->

  </form>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";

/* =====================================================================
   1. ХРАНИЛИЩЕ (localStorage) И УТИЛИТЫ
   ===================================================================== */
const store = {
  get(key, fallback) {
    try { const v = localStorage.getItem("nova." + key); return v === null ? fallback : JSON.parse(v); }
    catch (e) { return fallback; }
  },
  set(key, value) {
    try { localStorage.setItem("nova." + key, JSON.stringify(value)); }
    catch (e) { toast("Не удалось сохранить: память браузера недоступна"); }
  }
};

const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];
/** Экранирование текста перед вставкой в HTML. */
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pctClass = p => (p >= 80 ? "good" : p >= 50 ? "mid" : "bad");
const fmtDate = iso => new Date(iso).toLocaleString("ru-RU", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
const plural = (n, one, few, many) => { const m10 = n % 10, m100 = n % 100; return m10 === 1 && m100 !== 11 ? one : m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14) ? few : many; };

function toast(msg) {
  const t = $("#toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => t.classList.remove("show"), 2600);
}

/** Шапка раздела с кнопкой «Назад». */
function modHead(emoji, title, subtitle, backHref = "#/") {
  return `<div class="mod-head">
      <a class="back" href="${backHref}" aria-label="Назад">←</a>
      <div><h1>${emoji} ${title}</h1>${subtitle ? `<p>${subtitle}</p>` : ""}</div>
    </div>`;
}

function emptyState(icon, title, hint) {
  return `<div class="empty"><span class="e-icon">${icon}</span><b>${title}</b>${hint}</div>`;
}

/* =====================================================================
   2. ПРЕДМЕТЫ И ЗАГРУЗКА ДАННЫХ
   Классы — по типовым учебным программам РК (обновлённое содержание).
   Сами темы и вопросы лежат в data/<id>.json (их дописывает команда).
   ===================================================================== */

/** Мини-подсветка C++ без библиотек: ключевые слова, типы, строки, числа, комментарии. */
const CPP_KW = new Set("if else for while do return break continue switch case default class struct public private protected virtual override const using namespace new delete true false this template typename auto static void".split(" "));
const CPP_TYPES = new Set("int long short double float char bool string vector map set pair size_t unsigned signed cin cout endl unordered_map greater sort swap max min".split(" "));
function highlightCpp(code) {
  const re = /(\/\/[^\n]*|\/\*[\s\S]*?\*\/)|("(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*')|(^[ \t]*#[^\n]*)|(___)|\b(\d+(?:\.\d+)?)\b|\b([A-Za-z_]\w*)\b/gm;
  let out = "", last = 0, m;
  while ((m = re.exec(code))) {
    out += esc(code.slice(last, m.index));
    const [w, com, str, pre, blank, num, id] = m;
    if (com) out += `<span class="c">${esc(w)}</span>`;
    else if (str) out += `<span class="s">${esc(w)}</span>`;
    else if (pre) out += `<span class="p">${esc(w)}</span>`;
    else if (num) out += `<span class="n">${w}</span>`;
    else if (blank) out += `<span class="blank">___</span>`;
    else if (CPP_KW.has(id)) out += `<span class="k">${w}</span>`;
    else if (CPP_TYPES.has(id)) out += `<span class="t">${w}</span>`;
    else out += esc(w);
    last = re.lastIndex;
  }
  return out + esc(code.slice(last));
}
const codeBlock = code => `<pre class="code"><code>${highlightCpp(code)}</code></pre>`;

const SUBJECTS = [
  { id: "math",        name: "Математика",       emoji: "🔢", color: "#22A06B", grades: [5, 6] },
  { id: "algebra",     name: "Алгебра",          emoji: "📈", color: "#2f80ed", grades: [7, 8, 9, 10, 11] },
  { id: "geometry",    name: "Геометрия",        emoji: "📐", color: "#9b51e0", grades: [7, 8, 9, 10, 11] },
  { id: "physics",     name: "Физика",           emoji: "⚡", color: "#f2994a", grades: [7, 8, 9, 10, 11] },
  { id: "chemistry",   name: "Химия",            emoji: "🧪", color: "#eb5757", grades: [7, 8, 9, 10, 11] },
  { id: "biology",     name: "Биология",         emoji: "🧬", color: "#27ae60", grades: [7, 8, 9, 10, 11] },
  { id: "geography",   name: "География",        emoji: "🌍", color: "#00a3a3", grades: [7, 8, 9, 10, 11] },
  { id: "informatics", name: "Информатика",      emoji: "💻", color: "#3d5afe", grades: [5, 6, 7, 8, 9, 10, 11] },
  { id: "english",     name: "Английский язык",  emoji: "🇬🇧", color: "#d6336c", grades: [5, 6, 7, 8, 9, 10, 11] },
  { id: "history_kz",  name: "История Казахстана", emoji: "🏛️", color: "#b7791f", grades: [5, 6, 7, 8, 9, 10, 11] }
];
const subjectById = id => SUBJECTS.find(s => s.id === id);

const LEVELS = [
  { id: "easy",     name: "Лёгкий",      color: "#22A06B", hint: "Определения и базовые факты" },
  { id: "medium",   name: "Средний",     color: "#2f80ed", hint: "Применение в типовых задачах" },
  { id: "hard",     name: "Сложный",     color: "#f2994a", hint: "Задачи в несколько шагов" },
  { id: "olympiad", name: "Олимпиадный", color: "#d6336c", hint: "Нестандартные задачи" }
];
const levelById = id => LEVELS.find(l => l.id === id);
const PASS = 70; // тест считается сданным от 70%

/** Подключает <script> (работает и при открытии файла напрямую, file://). */
function loadScript(src) {
  return new Promise((resolve, reject) => {
    const s = document.createElement("script");
    s.src = src; s.onload = resolve; s.onerror = () => reject(new Error("Не удалось загрузить " + src));
    document.head.appendChild(s);
  });
}

/** Загружает JSON; при file:// — его копию data/js/<name>.js. */
async function loadJson(name) {
  window.NOVA_DATA = window.NOVA_DATA || {};
  if (location.protocol !== "file:") {
    try { const r = await fetch(`data/${name}.json`, { cache: "no-cache" }); if (r.ok) return await r.json(); } catch (e) { /* пробуем копию */ }
  }
  if (!window.NOVA_DATA[name]) await loadScript(`data/js/${name}.js`);
  return window.NOVA_DATA[name];
}

let INDEX = {};      // data/index.json: какие предметы готовы и сколько тем в каждом классе
const DATA = {};     // загруженные предметы

async function getSubject(id) {
  if (!DATA[id]) DATA[id] = await loadJson(id);
  return DATA[id];
}
const isReady = id => !!INDEX[id];
const topicCount = (sid, grade) => INDEX[sid]?.grades?.[grade] || 0;
const subjectTopicCount = sid => Object.values(INDEX[sid]?.grades || {}).reduce((a, b) => a + b, 0);

function findTopic(data, grade, tid) {
  for (const sec of data.classes[grade]?.sections || []) {
    const t = sec.topics.find(x => x.id === tid);
    if (t) return { topic: t, section: sec };
  }
  return null;
}

/* =====================================================================
   3. ПРОГРЕСС
   progress["physics|7|p7-density"] = { title, levels: { easy: { best, right, total, attempts } }, done, last }
   Тема пройдена (галочка), если хотя бы один уровень сдан на 70% и выше.
   ===================================================================== */
const pKey = (sid, grade, tid) => `${sid}|${grade}|${tid}`;
const getProgress = () => store.get("progress", {});
const topicProgress = (sid, grade, tid) => getProgress()[pKey(sid, grade, tid)];
const doneCount = (sid, grade) => Object.entries(getProgress())
  .filter(([k, v]) => v.done && k.startsWith(grade ? `${sid}|${grade}|` : `${sid}|`)).length;
const gradePercent = (sid, grade) => { const n = topicCount(sid, grade); return n ? Math.round(doneCount(sid, grade) / n * 100) : 0; };
const subjectPercent = sid => { const n = subjectTopicCount(sid); return n ? Math.round(doneCount(sid) / n * 100) : 0; };

function saveResult(sid, grade, topic, level, score, total) {
  const all = getProgress();
  const key = pKey(sid, grade, topic.id);
  const p = all[key] || { title: topic.title, levels: {} };
  const l = p.levels[level] || { best: 0, right: 0, total: 0, attempts: 0 };
  const percent = Math.round(score / total * 100);
  l.best = Math.max(l.best, percent); l.right += score; l.total += total; l.attempts++;
  p.levels[level] = l;
  p.title = topic.title;
  p.done = Object.values(p.levels).some(x => x.best >= PASS);
  p.last = new Date().toISOString();
  all[key] = p;
  store.set("progress", all);
  const hist = store.get("history", []);
  hist.unshift({ sid, grade, tid: topic.id, title: topic.title, level, score, total, percent, date: p.last });
  store.set("history", hist.slice(0, 200));
  return percent;
}

/* =====================================================================
   4. РОУТЕР (навигация без перезагрузки)
   #/                          — предметы
   #/s/<предмет>               — классы
   #/s/<предмет>/<класс>       — темы класса
   #/t/<предмет>/<класс>/<тема> — объяснение и выбор сложности
   #/q/<предмет>/<класс>/<тема>/<уровень> — тест
   #/weak, #/settings, #/hometry, #/tasks, #/team
   ===================================================================== */
const routes = {
  "": renderHome,
  s: renderSubjectOrGrade,
  t: renderTopic,
  q: renderQuiz,
  weak: renderWeakPoint,
  settings: renderSettings,
  hometry: renderHomeTry,
  tasks: renderTasks,
  team: renderTeam
};

async function router() {
  const parts = location.hash.replace(/^#\/?/, "").split("/").map(decodeURIComponent);
  const name = routes[parts[0]] ? parts[0] : "";
  if (name !== "q" && quiz) quiz = null; // ушли со страницы теста — тест сбрасывается
  $$(".top-nav a").forEach(a => a.classList.toggle("active", a.dataset.nav === (["s", "t", "q"].includes(name) ? "" : name)));
  const app = $("#app");
  app.innerHTML = `<div class="view"></div>`;
  window.scrollTo({ top: 0 });
  try {
    await routes[name](app.firstElementChild, ...parts.slice(1));
  } catch (e) {
    console.warn(e);
    app.firstElementChild.innerHTML = modHead("😕", "Не получилось открыть раздел", esc(e.message)) +
      emptyState("📂", "Данные не загрузились", "Проверь, что папка data/ лежит рядом с index.html, и обнови страницу.");
  }
}
window.addEventListener("hashchange", router);

/* =====================================================================
   5. ГЛАВНАЯ: предметы, статистика, инструменты
   ===================================================================== */
function renderHome(view) {
  const hist = store.get("history", []);
  const avg = hist.length ? Math.round(hist.reduce((s, h) => s + h.percent, 0) / hist.length) : null;
  const done = Object.values(getProgress()).filter(p => p.done).length;
  const active = store.get("tasks", []).filter(t => !t.done).length;
  const team = store.get("team", []).length;

  view.innerHTML = `
    <section class="hero">
      <p class="eyebrow">✦ ШКОЛЬНАЯ ПРОГРАММА КАЗАХСТАНА · 5–11 КЛАСС</p>
      <h1>Учись проще.<br><em>Развивайся быстрее.</em></h1>
      <p>Выбери предмет и класс — все темы по программе, короткие объяснения и тесты четырёх уровней: от лёгкого до олимпиадного.</p>
    </section>

    <section class="stats" aria-label="Статистика">
      <div class="stat"><b>${avg === null ? "—" : avg + "%"}</b><span>средний результат тестов</span></div>
      <div class="stat"><b>${done}</b><span>${plural(done, "тема пройдена", "темы пройдены", "тем пройдено")}</span></div>
      <div class="stat"><b>${active}</b><span>активных задач</span></div>
      <div class="stat"><b>${team}</b><span>в моей команде</span></div>
    </section>

    <div class="section-title"><h2>📚 Предметы</h2><span class="small muted">по классам 5–11</span></div>
    <section class="subjects">
      ${SUBJECTS.map(s => {
        const ready = isReady(s.id);
        const p = subjectPercent(s.id);
        return `<a class="subject" href="#/s/${s.id}" style="--c:${s.color}">
          ${ready ? "" : `<span class="soon">скоро</span>`}
          <span class="s-icon">${s.emoji}</span>
          <b>${s.name}</b>
          <small>${s.grades[0]}–${s.grades[s.grades.length - 1]} класс${ready ? ` · ${p}% пройдено` : ""}</small>
          ${ready ? `<div class="progress"><i style="width:${p}%"></i></div>` : ""}
        </a>`;
      }).join("")}
    </section>

    <div class="section-title"><h2>🧰 Инструменты</h2></div>
    <section class="tools">
      <a class="tool" href="#/weak"><span>🧠</span><div><b>WeakPoint</b><small>Слабые темы</small></div></a>
      <a class="tool" href="#/hometry"><span>🔍</span><div><b>HomeTry</b><small>Опыты дома</small></div></a>
      <a class="tool" href="#/tasks"><span>📅</span><div><b>TaskPlanner</b><small>Дедлайны</small></div></a>
      <a class="tool" href="#/team"><span>🤝</span><div><b>TeamSync</b><small>Поиск команды</small></div></a>
    </section>`;
}

/* =====================================================================
   6. ПРЕДМЕТ → КЛАСС → ТЕМА
   ===================================================================== */
async function renderSubjectOrGrade(view, sid, grade) {
  const s = subjectById(sid);
  if (!s) { location.hash = "#/"; return; }
  if (grade) return renderGrade(view, s, +grade);

  if (!isReady(sid)) {
    view.innerHTML = modHead(s.emoji, s.name, `${s.grades[0]}–${s.grades[s.grades.length - 1]} класс`) +
      emptyState("🛠️", "Раздел в разработке", "Темы и тесты по этому предмету скоро появятся. Пока загляни в другие предметы.");
    return;
  }
  const p = subjectPercent(sid);
  view.innerHTML = `
    ${modHead(s.emoji, s.name, "Выбери класс")}
    <section class="card">
      <div class="row between small"><b>Пройдено по предмету</b><span>${doneCount(sid)} из ${subjectTopicCount(sid)} тем</span></div>
      <div class="big-progress" style="margin-top:8px"><div class="progress"><i style="width:${p}%"></i></div><b class="pct ${pctClass(p)}">${p}%</b></div>
    </section>
    <section class="grades">
      ${s.grades.map(g => {
        const n = topicCount(sid, g);
        const gp = gradePercent(sid, g);
        return `<a class="grade" href="#/s/${sid}/${g}">
          <span class="g-num">${g}</span><b>${g} класс</b>
          <small>${n ? `${n} ${plural(n, "тема", "темы", "тем")} · ${gp}%` : "темы скоро появятся"}</small>
          <div class="progress"><i style="width:${gp}%"></i></div>
        </a>`;
      }).join("")}
    </section>
    <p class="small muted" style="margin-top:14px">Классы и темы — по типовой учебной программе РК (обновлённое содержание образования).</p>`;
}

async function renderGrade(view, s, grade) {
  const data = await getSubject(s.id);
  const cls = data.classes[grade];
  if (!cls) {
    view.innerHTML = modHead(s.emoji, `${s.name} · ${grade} класс`, "", `#/s/${s.id}`) +

    return;
  }
  const prog = getProgress();
  const gp = gradePercent(s.id, grade);

    <nav class="crumbs"><a href="#/s/${s.id}">${s.name}</a> › <span>${grade} класс</span></nav>

    <section class="card">
      <div class="row between small"><b>Пройдено в ${grade} классе</b><span>${doneCount(s.id, grade)} из ${topicCount(s.id, grade)}</span></div>

            const p = prog[pKey(s.id, grade, t.id)];
            const best = p ? Math.max(...Object.values(p.levels).map(l => l.best)) : null;
            return `<a class="topic-row ${p?.done ? "done" : ""}" href="#/t/${s.id}/${grade}/${t.id}">

              <span class="t-side">${t.check ? `<span class="badge-check" title="Проверить по учебнику">проверить</span>` : ""}${best !== null ? `<span class="pct ${pctClass(best)}">${best}%</span>` : ""}›</span>
            </a>`;
          }).join("")}

      </section>`).join("")}`;
}

/* =====================================================================
   7. ТЕСТ
   Вопрос в данных: { q, o: [варианты, первый — верный], a: 0, e: пояснение }
   ===================================================================== */
let quiz = null;

async function renderQuiz(view, sid, grade, tid, level) {
  const s = subjectById(sid);
  const data = await getSubject(sid);
  const found = findTopic(data, grade, tid);
  const lv = levelById(level);
  if (!s || !found || !lv || !(found.topic.levels[level] || []).length) { location.hash = `#/t/${sid}/${grade}/${tid}`; return; }
  const key = [sid, grade, tid, level].join("|");
  if (!quiz || quiz.key !== key) {
    const questions = shuffle(found.topic.levels[level]).map(q => {
      const order = shuffle(q.o.map((_, i) => i));
      return { ...q, o: order.map(i => q.o[i]), a: order.indexOf(q.a ?? 0) };
    });
    quiz = { key, sid, grade: +grade, tid, level, topic: found.topic, questions, answers: Array(questions.length).fill(null), i: 0 };
  }
  quiz.finished ? drawResult(view) : drawQuestion(view);
}

function drawQuestion(view) {
  const s = subjectById(quiz.sid);
  const lv = levelById(quiz.level);
  const q = quiz.questions[quiz.i];
  const total = quiz.questions.length;
  view.innerHTML = `
    <nav class="crumbs"><a href="#/s/${quiz.sid}">${s.name}</a> › <a href="#/s/${quiz.sid}/${quiz.grade}">${quiz.grade} класс</a> › <a href="#/t/${quiz.sid}/${quiz.grade}/${quiz.tid}">${esc(quiz.topic.title)}</a></nav>
    ${modHead(s.emoji, esc(quiz.topic.title), `Уровень: ${lv.name}`, `#/t/${quiz.sid}/${quiz.grade}/${quiz.tid}`)}
    <section class="card question">
      <div class="q-top"><span>Вопрос ${quiz.i + 1} из ${total}</span><span>${quiz.answers.filter(a => a !== null).length} отвечено</span></div>
      <div class="progress"><i style="width:${(quiz.i / total) * 100}%"></i></div>
      <h2>${esc(q.q)}</h2>
      ${q.code ? codeBlock(q.code) : ""}
      <div class="options">
        ${q.o.map((opt, k) => `<button class="option ${q.code ? "mono" : ""} ${quiz.answers[quiz.i] === k ? "picked" : ""}" data-k="${k}">${esc(opt)}</button>`).join("")}
      </div>
      <div class="row between" style="margin-top:16px">
        <button class="btn btn-ghost" id="prevQ" ${quiz.i === 0 ? "disabled" : ""}>← Назад</button>
        <button class="btn btn-primary" id="nextQ" ${quiz.answers[quiz.i] === null ? "disabled" : ""}>${quiz.i === total - 1 ? "Завершить тест" : "Далее →"}</button>
      </div>
    </section>`;
  $$(".option", view).forEach(b => b.onclick = () => { quiz.answers[quiz.i] = +b.dataset.k; drawQuestion(view); });
  $("#prevQ", view).onclick = () => { quiz.i--; drawQuestion(view); };
  $("#nextQ", view).onclick = () => {
    if (quiz.i < total - 1) { quiz.i++; drawQuestion(view); return; }
    const score = quiz.questions.filter((q, i) => quiz.answers[i] === q.a).length;
    quiz.score = score;
    quiz.percent = saveResult(quiz.sid, quiz.grade, quiz.topic, quiz.level, score, total);
    quiz.finished = true;
    drawResult(view);
    window.scrollTo({ top: 0 });
  };
}

function drawResult(view) {
  const s = subjectById(quiz.sid);
  const lv = levelById(quiz.level);
  const total = quiz.questions.length;
  const pct = quiz.percent;
  const color = pct >= 80 ? "var(--ok)" : pct >= 50 ? "var(--warn)" : "var(--danger)";
  const msg = pct >= 80 ? "Отличный результат! 🔥" : pct >= PASS ? "Тест сдан! Можно попробовать уровень сложнее 💪" : pct >= 50 ? "Почти! Разберём ошибки и попробуем снова 💪" : "Не страшно — разберём ошибки вместе 🌱";
  const mistakes = quiz.questions.map((q, i) => ({ q, i, picked: quiz.answers[i] })).filter(x => x.picked !== x.q.a);
  const nextLevel = LEVELS[LEVELS.findIndex(l => l.id === quiz.level) + 1];

  view.innerHTML = `
    <nav class="crumbs"><a href="#/s/${quiz.sid}">${s.name}</a> › <a href="#/s/${quiz.sid}/${quiz.grade}">${quiz.grade} класс</a> › <a href="#/t/${quiz.sid}/${quiz.grade}/${quiz.tid}">${esc(quiz.topic.title)}</a></nav>
    ${modHead(s.emoji, "Результат", `${esc(quiz.topic.title)} · ${lv.name}`, `#/t/${quiz.sid}/${quiz.grade}/${quiz.tid}`)}
    <section class="card result-top">
      <div class="ring" style="--p:${pct}; --ring-c:${color}"><div>${pct}%</div></div>
      <div>
        <h2 style="margin-bottom:4px">${quiz.score} из ${total} правильно</h2>
        <p class="muted">${msg}</p>
        <div class="row">
          <button class="btn btn-primary" id="retry">↻ Ещё раз</button>
          ${nextLevel && pct >= PASS ? `<a class="btn btn-soft" href="#/q/${quiz.sid}/${quiz.grade}/${quiz.tid}/${nextLevel.id}">Уровень «${nextLevel.name}» →</a>` : ""}
          <a class="btn" href="#/s/${quiz.sid}/${quiz.grade}">К темам класса</a>
        </div>
      </div>
    </section>
    <section class="card">
      <h3>${mistakes.length ? `❌ Ошибки (${mistakes.length})` : "🏆 Без ошибок!"}</h3>
      ${mistakes.length ? mistakes.map(m => `
        <div class="mistake">
          <p><b>${esc(m.q.q)}</b></p>
          ${m.q.code ? codeBlock(m.q.code) : ""}
          <p class="bad">Твой ответ: ${esc(m.q.o[m.picked])}</p>
          <p class="good">Правильно: ${esc(m.q.o[m.q.a])}</p>
          <button class="btn btn-sm btn-soft explain-btn" data-explain="${m.i}">🤖 Объясни</button>
        </div>`).join("")
      : `<p class="muted">Все ответы верные. Попробуй уровень сложнее!</p>`}
    </section>`;

  $("#retry", view).onclick = () => { quiz = null; router(); };
  $$("[data-explain]", view).forEach(b => b.onclick = () => {
    const i = +b.dataset.explain;
    const q = quiz.questions[i];
    openAi({
      subject: s.name, grade: quiz.grade, level: lv.name, topic: quiz.topic.title, topicExplain: quiz.topic.explain,
      q: q.q + (q.code ? "\n" + q.code : ""), options: q.o, picked: q.o[quiz.answers[i]], correct: q.o[q.a], e: q.e
    });
  });
}

/* =====================================================================
   8. WEAKPOINT — слабые темы по результатам тестов
   ===================================================================== */
let weakFilter = "";

function renderWeakPoint(view) {
  const prog = getProgress();
  const hist = store.get("history", []);
  const rows = Object.entries(prog).map(([key, p]) => {
    const [sid, grade, tid] = key.split("|");
    const right = Object.values(p.levels).reduce((a, l) => a + l.right, 0);
    const total = Object.values(p.levels).reduce((a, l) => a + l.total, 0);
    return { sid, grade, tid, title: p.title, acc: total ? Math.round(right / total * 100) : 0, total, done: p.done };
  });
  const weak = rows.filter(r => r.acc < PASS && (!weakFilter || r.sid === weakFilter)).sort((a, b) => a.acc - b.acc);
  const strong = rows.filter(r => r.acc >= 85 && (!weakFilter || r.sid === weakFilter)).sort((a, b) => b.acc - a.acc).slice(0, 5);
  const usedSubjects = SUBJECTS.filter(s => rows.some(r => r.sid === s.id));
  const avg = hist.length ? Math.round(hist.reduce((s, h) => s + h.percent, 0) / hist.length) : null;

  view.innerHTML = `
    ${modHead("🧠", "WeakPoint", "Темы, которые проседают по результатам твоих тестов")}
    ${!rows.length ? emptyState("🎯", "Пока нечего анализировать", `Пройди хотя бы один тест по любой теме — здесь появятся слабые места.<br><br><a class="btn btn-primary" href="#/">Выбрать предмет</a>`) : `
    <section class="stats" style="margin-top:0">
      <div class="stat"><b>${avg}%</b><span>средний результат</span></div>
      <div class="stat"><b>${hist.length}</b><span>${plural(hist.length, "тест пройден", "теста пройдено", "тестов пройдено")}</span></div>
      <div class="stat"><b>${rows.filter(r => r.done).length}</b><span>тем сдано</span></div>
      <div class="stat"><b>${rows.filter(r => r.acc < PASS).length}</b><span>слабых тем</span></div>
    </section>
    ${usedSubjects.length > 1 ? `<div class="chips" style="margin-bottom:14px">
      <button class="chip ${!weakFilter ? "active" : ""}" data-f="">Все предметы</button>
      ${usedSubjects.map(s => `<button class="chip ${weakFilter === s.id ? "active" : ""}" data-f="${s.id}">${s.emoji} ${s.name}</button>`).join("")}
    </div>` : ""}
    <div class="two-col">
      <section class="card">
        <h3>📉 Что повторить</h3>
        ${weak.length ? weak.map(r => {
          const s = subjectById(r.sid);
          return `<a class="weak" href="#/t/${r.sid}/${r.grade}/${r.tid}">
            <div><b>${esc(r.title)}</b><small>${s.emoji} ${s.name} · ${r.grade} класс · ответов: ${r.total}</small></div>
            <span class="pct ${pctClass(r.acc)}">${r.acc}%</span></a>`;
        }).join("") : `<p class="muted">Слабых тем нет — все пройденные темы выше ${PASS}%. Так держать! 🎉</p>`}
        <p class="small muted">Процент — доля верных ответов по теме за все попытки и уровни. Нажми на тему, чтобы повторить объяснение и пройти тест снова.</p>
      </section>
      <section class="card">
        <h3>💪 Сильные темы</h3>
        ${strong.length ? strong.map(r => `<div class="hist-item"><span>${subjectById(r.sid).emoji} ${esc(r.title)}</span><span class="pct good">${r.acc}%</span></div>`).join("") : `<p class="muted">Здесь появятся темы, где ты отвечаешь верно на 85% и больше.</p>`}
        <h3 style="margin-top:18px">🕑 Последние тесты</h3>
        ${hist.slice(0, 8).map(h => `<div class="hist-item"><div><b>${esc(h.title)}</b><br><span class="small muted">${subjectById(h.sid)?.emoji || ""} ${h.grade} кл · ${levelById(h.level)?.name} · ${fmtDate(h.date)}</span></div><span class="pct ${pctClass(h.percent)}">${h.percent}%</span></div>`).join("")}
      </section>
    </div>`}`;
  $$("[data-f]", view).forEach(b => b.onclick = () => { weakFilter = b.dataset.f; renderWeakPoint(view); });
}

/* =====================================================================
   9. AI-ПОМОЩНИК «ОБЪЯСНИ ОШИБКУ»
   Бесплатно и без ключей: пояснение из данных вопроса + статьи Википедии (API, origin=*).
   ===================================================================== */
const ai = { ctx: null, messages: [], busy: false };

/** Простая разметка: **жирный**, списки, ссылки, переносы строк. */
function md(text) {
  const lines = esc(text).split("\n");
  let html = "", inList = false;
  for (const line of lines) {
    const li = line.match(/^\s*(?:[-*•]|\d+[.)])\s+(.*)/);
    if (li) { if (!inList) { html += "<ul>"; inList = true; } html += `<li>${li[1]}</li>`; continue; }
    if (inList) { html += "</ul>"; inList = false; }
    html += line.trim() ? line + "<br>" : "<br>";
  }
  if (inList) html += "</ul>";
  return html
    .replace(/\*\*(.+?)\*\*/g, "<b>$1</b>")
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/(<br>){3,}/g, "<br><br>");
}

function sourcesHtml(list, title = "📚 Статьи по теме") {
  if (!list?.length) return "";
  return `<div class="sources"><b>${title}:</b>${list.map(s => `<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title)} ↗</a>`).join("")}</div>`;
}

function aiAdd(who, html) {
  const body = $("#aiBody");
  const div = document.createElement("div");
  div.className = "msg " + who;
  div.innerHTML = html;
  body.appendChild(div);
  body.scrollTop = body.scrollHeight;
  return div;
}
function aiTyping() { return aiAdd("bot typing", "<span></span><span></span><span></span>"); }

function openAi(ctx) {
  ai.ctx = ctx; ai.messages = [];
  $("#aiSub").textContent = `${ctx.subject} · ${ctx.grade} класс · ${ctx.level}`;
  $("#aiMode").textContent = "бесплатно";
  $("#aiBody").innerHTML = `
    <div class="ai-ctx">
      <p><b>${esc(ctx.q)}</b></p>
      <p style="color:var(--danger)">Твой ответ: ${esc(ctx.picked)}</p>
      <p style="color:var(--ok)">Правильно: ${esc(ctx.correct)}</p>
    </div>`;
  $("#aiPanel").classList.add("open");
  $("#aiPanel").setAttribute("aria-hidden", "false");
  $("#aiBackdrop").classList.add("open");
  firstExplanation();
}

function closeAi() {
  $("#aiPanel").classList.remove("open");
  $("#aiPanel").setAttribute("aria-hidden", "true");
  $("#aiBackdrop").classList.remove("open");
}

/** Первое объяснение — из материалов NOVA. */
async function firstExplanation() { await localExplanation(); }

async function localExplanation() {
  const c = ai.ctx;
  const levelTip = {
    "Лёгкий": "Это вопрос на знание определения или правила — перечитай их и попробуй своими словами пересказать.",
    "Средний": "Здесь нужно применить правило к задаче. Выпиши, что дано и что нужно найти, и подбери подходящую формулу или правило.",
    "Сложный": "Задача в несколько шагов. Разбей её на маленькие шаги и проверь каждый отдельно — ошибка часто прячется в промежуточном вычислении.",
    "Олимпиадный": "В олимпиадных задачах важна идея. Попробуй рассмотреть частный случай, нарисовать схему или проверить ответ подстановкой."
  }[c.level] || "";
  aiAdd("bot", md(`**Почему «${c.picked}» — неверно.**\nПравильный ответ: **${c.correct}**.\n\n${c.e}\n\n**Вспомни теорию:** ${c.topicExplain.replace(/\n/g, " ")}\n\n**Совет:** ${levelTip}`) +
    `<p class="small muted" style="margin:6px 0 0">Объяснение из материалов NOVA.</p>`);
  const t = aiTyping();
  const links = await wikiSearch(`${c.topic} ${c.subject === "Английский язык" ? "грамматика английского языка" : ""}`.trim());
  t.remove();
  aiAdd("bot", sourcesHtml(links.length ? links : [wikiSearchLink(c.topic)]));
}

/* --- Википедия (без ключа) --- */
async function wikiSearch(query, limit = 3) {
  try {
    const url = "https://ru.wikipedia.org/w/api.php?action=query&list=search&format=json&origin=*&srlimit=" + limit + "&srsearch=" + encodeURIComponent(query);
    const r = await fetch(url);
    const d = await r.json();
    return (d.query?.search || []).map(x => ({ title: "Википедия: " + x.title, url: "https://ru.wikipedia.org/wiki/" + encodeURIComponent(x.title.replace(/ /g, "_")), raw: x.title }));
  } catch (e) { return []; }
}
/** Ссылка на поиск по Википедии — работает, даже если API недоступен. */
function wikiSearchLink(query) {
  return { title: "Поиск в Википедии: " + query, url: "https://ru.wikipedia.org/w/index.php?search=" + encodeURIComponent(query) };
}
async function wikiExtract(title) {
  try {
    const url = "https://ru.wikipedia.org/w/api.php?action=query&prop=extracts&exintro=1&explaintext=1&exsentences=3&format=json&origin=*&titles=" + encodeURIComponent(title);
    const d = await (await fetch(url)).json();
    const page = Object.values(d.query?.pages || {})[0];
    return page?.extract || "";
  } catch (e) { return ""; }
}

async function localFollowUp(question) {
  const t = aiTyping();
  const links = await wikiSearch(`${question} ${ai.ctx.topic}`);
  let found = links.length ? links : await wikiSearch(question);
  if (!found.length) found = [wikiSearchLink(question)];
  const extract = found[0]?.raw ? await wikiExtract(found[0].raw) : "";
  t.remove();
  aiAdd("bot", (extract ? md(`Вот что пишет Википедия («${found[0].raw}»):\n${extract}`) : md("Вот статьи, которые помогут разобраться.")) +
    sourcesHtml(found));
}

/* Обработчики панели */
$("#aiClose").onclick = closeAi;
$("#aiBackdrop").onclick = closeAi;
document.addEventListener("keydown", e => { if (e.key === "Escape") closeAi(); });
$("#aiForm").onsubmit = async e => {
  e.preventDefault();
  const input = $("#aiInput");
  const text = input.value.trim();
  if (!text || ai.busy || !ai.ctx) return;
  input.value = "";
  aiAdd("me", esc(text));
  ai.busy = true;
  await localFollowUp(text);
  ai.busy = false;
};

/** Статус по дедлайну: overdue — просрочено, urgent — меньше суток. */
function deadlineStatus(task) {
  if (task.done || !task.deadline) return "";
  const diff = new Date(task.deadline) - Date.now();
  if (diff < 0) return "overdue";
  if (diff < 24 * 60 * 60 * 1000) return "urgent";
  return "";
}

function deadlineLabel(task) {
  if (!task.deadline) return "без дедлайна";
  const st = deadlineStatus(task);
  const when = fmtDate(task.deadline);
  if (st === "overdue") return "⛔ просрочено · " + when;
  if (st === "urgent") {
    const h = Math.max(1, Math.round((new Date(task.deadline) - Date.now()) / 3600000));
    return `🔥 через ${h} ч · ${when}`;
  }
  return "⏰ " + when;
}

        <div class="row between"><h3 style="margin:0">📈 Прогресс</h3><b>${doneCount} из ${tasks.length}</b></div>
        <div class="progress" style="margin:12px 0 8px"><i style="width:${percent}%"></i></div>
        <p class="small muted">${tasks.length ? `Выполнено ${percent}% · активных: ${tasks.length - doneCount}` : "Добавь задачи, чтобы видеть прогресс."}</p>
        <div class="row small" style="gap:6px">
          <span class="chip deadline overdue">⛔ просрочено</span>
          <span class="chip deadline urgent">🔥 меньше суток</span>
        </div>
      </section>
    </div>

    <div class="row between" style="margin:4px 0 14px">
      <div class="seg" role="tablist" aria-label="Фильтр задач">
        ${[["all", "Все"], ["active", "Активные"], ["done", "Выполненные"]].map(([k, v]) => `<button data-filter="${k}" class="${taskFilter === k ? "active" : ""}">${v}</button>`).join("")}
      </div>
      <span class="small muted">Сортировка: по дедлайну</span>
    </div>
    <div id="taskList"></div>`;

  // Список: фильтр + сортировка по дедлайну (без дедлайна — в конце), затем по приоритету
  const list = tasks
    .filter(t => taskFilter === "all" || (taskFilter === "active" ? !t.done : t.done))
    .sort((a, b) => {
      if (a.done !== b.done) return a.done ? 1 : -1;
      const da = a.deadline ? new Date(a.deadline).getTime() : Infinity;
      const db = b.deadline ? new Date(b.deadline).getTime() : Infinity;
      return da - db || PRIORITY_RANK[a.priority] - PRIORITY_RANK[b.priority];
    });

  const box = $("#taskList", view);
  if (!tasks.length) {
    box.innerHTML = emptyState("🗒️", "Задач пока нет", "Заполни форму выше: название, предмет, дедлайн и приоритет.");
  } else if (!list.length) {
    box.innerHTML = emptyState(taskFilter === "done" ? "⏳" : "🎉", taskFilter === "done" ? "Выполненных задач пока нет" : "Все задачи выполнены!", taskFilter === "done" ? "Отметь задачу галочкой, когда закончишь её." : "Отличная работа. Добавь новую задачу, когда понадобится.");
  } else {
    box.innerHTML = list.map(t => {
      const st = deadlineStatus(t);
      return `
        <article class="task ${t.done ? "done" : ""} ${st}">
          <button class="check" data-toggle="${t.id}" aria-label="${t.done ? "Вернуть в активные" : "Отметить выполненной"}">${t.done ? "✓" : ""}</button>
          <div class="t-body">
            <div class="t-title">${esc(t.title)}</div>
            <div class="t-meta">
              ${t.subject ? `<span class="chip">📚 ${esc(t.subject)}</span>` : ""}
              <span class="chip prio-${t.priority}">● ${PRIORITY[t.priority]}</span>
              <span class="chip deadline ${st}">${deadlineLabel(t)}</span>
            </div>
          </div>
          <div class="t-actions">
            <button class="icon-btn" data-edit="${t.id}" aria-label="Редактировать">✏️</button>
            <button class="icon-btn" data-del="${t.id}" aria-label="Удалить">🗑️</button>
          </div>
        </article>`;
    }).join("");
  }

  // --- обработчики ---
  $("#taskForm", view).onsubmit = e => {
    e.preventDefault();
    const f = new FormData(e.target);
    const data = {
      title: f.get("title").trim(),
      subject: f.get("subject").trim(),
      priority: f.get("priority"),
      deadline: f.get("deadline")
    };
    if (!data.title) return toast("Введи название задачи");
    let all = store.get("tasks", []);
    if (editingTaskId) {
      all = all.map(t => t.id === editingTaskId ? { ...t, ...data } : t);
      toast("Задача обновлена ✓");
    } else {
      all.push({ id: uid(), done: false, created: new Date().toISOString(), ...data });
      toast("Задача добавлена ✓");
    }
    editingTaskId = null;
    store.set("tasks", all);
    renderTasks(view);
  };
  const cancel = $("#cancelEdit", view);
  if (cancel) cancel.onclick = () => { editingTaskId = null; renderTasks(view); };

  $$("[data-filter]", view).forEach(b => b.onclick = () => { taskFilter = b.dataset.filter; renderTasks(view); });
  $$("[data-toggle]", view).forEach(b => b.onclick = () => {
    store.set("tasks", store.get("tasks", []).map(t => t.id === b.dataset.toggle ? { ...t, done: !t.done } : t));
    renderTasks(view);
  });
  $$("[data-edit]", view).forEach(b => b.onclick = () => { editingTaskId = b.dataset.edit; renderTasks(view); window.scrollTo({ top: 0, behavior: "smooth" }); });
  $$("[data-del]", view).forEach(b => b.onclick = () => {
    if (!confirm("Удалить задачу?")) return;
    if (editingTaskId === b.dataset.del) editingTaskId = null;
    store.set("tasks", store.get("tasks", []).filter(t => t.id !== b.dataset.del));
    toast("Задача удалена");
    renderTasks(view);
  });
}

/* =====================================================================
   15. МОДУЛЬ TEAMSYNC
   ===================================================================== */
let teamTab = "feed";
let teamQuery = "";
let teamSkill = "";

/** Все анкеты: моя (если есть) + демо. */
function allPeople() {
  const mine = store.get("myProfile", null);
  return mine ? [{ ...mine, mine: true }, ...DEMO_PEOPLE] : DEMO_PEOPLE;
}

function avatar(person, i) {
  const color = AVATAR_COLORS[i % AVATAR_COLORS.length];
  return `<span class="avatar" style="background:${color}">${esc(person.name.trim().charAt(0).toUpperCase() || "?")}</span>`;
}

function personCard(p, i, team) {
  const inTeam = team.includes(p.id);
  return `
    <article class="person ${p.mine ? "mine" : ""}">
      <div class="p-head">${avatar(p, i)}<div><b>${esc(p.name)}</b><small>${p.mine ? "Это ты" : esc(p.skills.slice(0, 2).join(" · "))}</small></div></div>
      <div class="chips">${p.skills.map(s => `<span class="chip">${esc(s)}</span>`).join("")}</div>
      <p><span class="label">Интересы:</span> ${esc(p.interests)}</p>
      <p><span class="label">Ищу:</span> ${esc(p.looking)}</p>
      ${p.mine
        ? `<button class="btn btn-sm" data-tab="profile">✏️ Редактировать анкету</button>`
        : `<button class="btn btn-sm ${inTeam ? "in-team" : "btn-primary"}" data-join="${p.id}">${inTeam ? "✓ В команде" : "🤝 Хочу в команду"}</button>`}
    </article>`;
}

function renderTeam(view) {
  const team = store.get("team", []);
  const people = allPeople();
  const mine = store.get("myProfile", null);

  let body = "";
  if (teamTab === "feed") {
    const skills = [...new Set(people.flatMap(p => p.skills))].sort((a, b) => a.localeCompare(b, "ru"));
    const q = teamQuery.trim().toLowerCase();
    const list = people.filter(p =>
      (!teamSkill || p.skills.includes(teamSkill)) &&
      (!q || [p.name, p.interests, p.looking, ...p.skills].join(" ").toLowerCase().includes(q)));
    body = `
      <label class="field"><span>Поиск</span><input type="search" id="teamSearch" placeholder="Имя, интерес или навык…" value="${esc(teamQuery)}" autocomplete="off"></label>
      <div class="chips" style="margin-bottom:16px">
        <button class="chip ${!teamSkill ? "active" : ""}" data-skill="">Все навыки</button>
        ${skills.map(s => `<button class="chip ${teamSkill === s ? "active" : ""}" data-skill="${esc(s)}">${esc(s)}</button>`).join("")}
      </div>
      ${list.length
        ? `<div class="people">${list.map((p, i) => personCard(p, people.indexOf(p), team)).join("")}</div>`
        : emptyState("🔍", "Никого не нашли", "Измени запрос или выбери «Все навыки».")}`;
  } else if (teamTab === "team") {
    const members = people.filter(p => team.includes(p.id));
    body = members.length
      ? `<div class="people">${members.map(p => personCard(p, people.indexOf(p), team)).join("")}</div>`
      : emptyState("🤝", "В твоей команде пока никого", "Открой «Ленту анкет» и нажми «Хочу в команду» у тех, с кем хочешь работать.");
  } else {
    body = `
      <section class="card">
        <h3>${mine ? "✏️ Моя анкета" : "📝 Создай анкету"}</h3>
        <p class="small muted">Анкета появится в ленте, и другие увидят, чем ты можешь помочь.</p>
        <form id="profileForm" autocomplete="off">
          <label class="field"><span>Имя *</span><input type="text" name="name" required maxlength="40" value="${esc(mine?.name)}" placeholder="Как тебя зовут"></label>
          <label class="field"><span>Навыки * (через запятую)</span><input type="text" name="skills" required maxlength="160" value="${esc(mine?.skills.join(", "))}" placeholder="JavaScript, Дизайн, Презентации"></label>
          <label class="field"><span>Интересы</span><textarea name="interests" maxlength="200" placeholder="Что тебе интересно">${esc(mine?.interests)}</textarea></label>
          <label class="field"><span>Кого ищу</span><textarea name="looking" maxlength="200" placeholder="Кто нужен тебе в команду">${esc(mine?.looking)}</textarea></label>
          <div class="row">
            <button class="btn btn-primary" type="submit">${mine ? "Сохранить" : "Опубликовать анкету"}</button>
            ${mine ? `<button class="btn btn-ghost btn-danger" type="button" id="delProfile">Удалить анкету</button>` : ""}
          </div>
        </form>
      </section>`;
  }

  view.innerHTML = `
    ${modHead("🤝", "TeamSync", "Найди людей для проекта, олимпиады или хакатона")}
    <div class="tabs" role="tablist">
      <button class="${teamTab === "feed" ? "active" : ""}" data-tab="feed">Лента анкет <span>${people.length}</span></button>
      <button class="${teamTab === "team" ? "active" : ""}" data-tab="team">Моя команда <span>${team.length}</span></button>
      <button class="${teamTab === "profile" ? "active" : ""}" data-tab="profile">${mine ? "Моя анкета" : "+ Создать анкету"}</button>
    </div>
    ${body}`;

  // --- обработчики ---
  $$("[data-tab]", view).forEach(b => b.onclick = () => { teamTab = b.dataset.tab; renderTeam(view); });
  $$("[data-skill]", view).forEach(b => b.onclick = () => { teamSkill = b.dataset.skill; renderTeam(view); });
  const search = $("#teamSearch", view);
  if (search) search.oninput = e => {
    teamQuery = e.target.value;
    const pos = e.target.selectionStart;
    renderTeam(view);
    const s = $("#teamSearch", view); s.focus(); s.setSelectionRange(pos, pos);
  };
  $$("[data-join]", view).forEach(b => b.onclick = () => {
    const id = b.dataset.join;
    const cur = store.get("team", []);
    const name = people.find(p => p.id === id)?.name;
    if (cur.includes(id)) { store.set("team", cur.filter(x => x !== id)); toast(`${name} убран(а) из команды`); }
    else { store.set("team", [...cur, id]); toast(`${name} добавлен(а) в команду 🤝`); }
    renderTeam(view);
  });
  const form = $("#profileForm", view);
  if (form) form.onsubmit = e => {
    e.preventDefault();
    const f = new FormData(form);
    const skills = f.get("skills").split(",").map(s => s.trim()).filter(Boolean);
    if (!f.get("name").trim() || !skills.length) return toast("Заполни имя и хотя бы один навык");
    store.set("myProfile", {
      id: "me", name: f.get("name").trim(), skills,
      interests: f.get("interests").trim() || "—", looking: f.get("looking").trim() || "—"
    });
    toast("Анкета сохранена ✓");
    teamTab = "feed";
    renderTeam(view);
  };
  const del = $("#delProfile", view);
  if (del) del.onclick = () => {
    if (!confirm("Удалить твою анкету?")) return;
    store.set("myProfile", null);
    teamTab = "feed";
    renderTeam(view);
  };
}

  try { INDEX = (await loadJson("index")) || {}; }
  catch (e) { INDEX = {}; console.warn("Нет data/index.json — запусти tools/build-data.py", e); }
  router();
})();
</script>
