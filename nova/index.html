<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NOVA Lite — Smart Student Platform</title>
<meta name="description" content="NOVA Lite: тесты и анализ ошибок, объяснения через предметы, планировщик заданий и поиск команды.">
<meta name="theme-color" content="#0b0d14">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✦</text></svg>">
<style>
/* =====================================================================
   1. ПЕРЕМЕННЫЕ И БАЗА
   ===================================================================== */
:root {
  --bg: #0b0d14;
  --bg-2: #11141e;
  --card: #161a26;
  --card-2: #1c2130;
  --line: #262c3d;
  --text: #eef0f7;
  --muted: #8d93a8;
  --accent: #8b7bff;
  --accent-2: #5ee7df;
  --ok: #3ddc97;
  --warn: #ffb347;
  --danger: #ff5c7a;
  --radius: 20px;
  --radius-sm: 12px;
  --shadow: 0 10px 30px rgba(0, 0, 0, .35);
  --ease: cubic-bezier(.2, .8, .2, 1);
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; min-height: 100vh;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  color: var(--text); line-height: 1.5;
  background:
    radial-gradient(700px 400px at 90% -10%, rgba(139, 123, 255, .18), transparent 60%),
    radial-gradient(600px 400px at -10% 30%, rgba(94, 231, 223, .08), transparent 60%),
    var(--bg);
  background-attachment: fixed;
}
h1, h2, h3, h4 { margin: 0 0 .5em; line-height: 1.2; letter-spacing: -.01em; }
p { margin: 0 0 .8em; }
a { color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }
.muted { color: var(--muted); }
.small { font-size: .85rem; }
.hidden { display: none !important; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.wrap { max-width: 1040px; margin: 0 auto; padding: 0 16px; }

/* =====================================================================
   2. ШАПКА
   ===================================================================== */
.topbar {
  position: sticky; top: 0; z-index: 20;
  background: rgba(11, 13, 20, .78); backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--line);
}
.topbar .wrap { display: flex; align-items: center; justify-content: space-between; height: 64px; }
.logo { display: flex; flex-direction: column; text-decoration: none; color: var(--text); }
.logo b { font-size: 1.35rem; letter-spacing: .06em; font-weight: 800; }
.logo b span { color: var(--accent); display: inline-block; transition: transform .6s var(--ease); }
.logo:hover b span { transform: rotate(180deg) scale(1.15); }
.logo small { font-size: .62rem; letter-spacing: .22em; color: var(--muted); font-weight: 600; }
.top-nav { display: none; gap: 4px; }
.top-nav a {
  text-decoration: none; color: var(--muted); font-size: .9rem; font-weight: 600;
  padding: 8px 12px; border-radius: 999px; transition: background .2s, color .2s;
}
.top-nav a:hover { color: var(--text); background: var(--card); }
.top-nav a.active { color: var(--text); background: var(--card-2); }

/* =====================================================================
   3. ОБЩИЕ КОМПОНЕНТЫ: карточки, кнопки, поля, чипы
   ===================================================================== */
main { padding: 20px 0 60px; }
.view { animation: viewIn .45s var(--ease); }
@keyframes viewIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }

.card {
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 18px; margin-bottom: 16px;
}
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  border: 1px solid var(--line); background: var(--card-2); color: var(--text);
  padding: 11px 16px; border-radius: var(--radius-sm); cursor: pointer; font-weight: 600;
  text-decoration: none; transition: transform .15s var(--ease), background .2s, border-color .2s, opacity .2s;
}
.btn:hover { border-color: #3a4260; transform: translateY(-1px); }
.btn:active { transform: scale(.97); }
.btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }
.btn-primary { background: var(--accent); border-color: var(--accent); color: #0b0d14; }
.btn-primary:hover { background: #a194ff; border-color: #a194ff; }
.btn-ghost { background: transparent; }
.btn-danger { color: var(--danger); }
.btn-sm { padding: 7px 11px; font-size: .85rem; border-radius: 10px; }
.btn-block { width: 100%; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.row.between { justify-content: space-between; }

label.field { display: block; margin-bottom: 12px; }
label.field > span { display: block; font-size: .82rem; color: var(--muted); margin-bottom: 6px; font-weight: 600; }
input[type=text], input[type=search], input[type=datetime-local], select, textarea {
  width: 100%; background: var(--bg-2); border: 1px solid var(--line); border-radius: var(--radius-sm);
  padding: 11px 13px; transition: border-color .2s, box-shadow .2s; color-scheme: dark;
}
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(139, 123, 255, .2); }
textarea { resize: vertical; min-height: 70px; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  font-size: .78rem; font-weight: 600; padding: 4px 10px; border-radius: 999px;
  background: var(--card-2); border: 1px solid var(--line); color: var(--muted);
}
button.chip { cursor: pointer; transition: all .2s; }
button.chip:hover { color: var(--text); }
button.chip.active, .chip.on { background: rgba(139, 123, 255, .16); border-color: var(--accent); color: var(--text); }

.seg { display: inline-flex; background: var(--bg-2); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
.seg button { border: 0; background: transparent; padding: 7px 13px; border-radius: 999px; cursor: pointer; color: var(--muted); font-weight: 600; font-size: .85rem; transition: all .2s; }
.seg button.active { background: var(--card-2); color: var(--text); }

.empty {
  text-align: center; padding: 36px 18px; border: 1px dashed var(--line); border-radius: var(--radius);
  color: var(--muted); background: rgba(22, 26, 38, .5);
}
.empty .e-icon { font-size: 2.4rem; display: block; margin-bottom: 8px; }
.empty b { color: var(--text); display: block; margin-bottom: 4px; }

.progress { height: 8px; background: var(--bg-2); border-radius: 999px; overflow: hidden; }
.progress > i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-2)); border-radius: inherit; transition: width .6s var(--ease); }

/* Шапка модуля с кнопкой «Назад» */
.mod-head { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
.back {
  width: 42px; height: 42px; flex: none; display: grid; place-items: center;
  border-radius: 12px; background: var(--card); border: 1px solid var(--line);
  color: var(--text); text-decoration: none; font-size: 1.2rem; transition: transform .2s var(--ease), border-color .2s;
}
.back:hover { transform: translateX(-3px); border-color: var(--accent); }
.mod-head h1 { margin: 0; font-size: 1.45rem; }
.mod-head p { margin: 0; color: var(--muted); font-size: .9rem; }

.toast {
  position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px); opacity: 0;
  background: var(--card-2); border: 1px solid var(--line); padding: 12px 18px; border-radius: 14px;
  box-shadow: var(--shadow); transition: all .3s var(--ease); pointer-events: none; z-index: 50; font-weight: 600;
  max-width: calc(100% - 32px); text-align: center;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* =====================================================================
   4. ГЛАВНАЯ
   ===================================================================== */
.hero { padding: 18px 0 8px; }
.hero .eyebrow { font-size: .72rem; letter-spacing: .22em; color: var(--accent-2); font-weight: 700; margin-bottom: 10px; }
.hero h1 { font-size: clamp(2rem, 7vw, 3.2rem); font-weight: 800; margin-bottom: 12px; }
.hero h1 em { font-style: normal; background: linear-gradient(90deg, var(--accent), var(--accent-2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.hero p { color: var(--muted); max-width: 520px; }

.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 18px 0; }
.stat { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; }
.stat b { display: block; font-size: 1.5rem; font-weight: 800; }
.stat span { font-size: .75rem; color: var(--muted); }

.modules { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
.module {
  position: relative; overflow: hidden; display: flex; flex-direction: column; gap: 6px;
  min-height: 150px; padding: 18px; border-radius: var(--radius); text-decoration: none; color: var(--text);
  background: var(--card); border: 1px solid var(--line);
  transition: transform .35s var(--ease), border-color .3s, box-shadow .3s;
}
.module::after {
  content: ""; position: absolute; inset: auto -40px -40px auto; width: 130px; height: 130px; border-radius: 50%;
  background: var(--glow); opacity: .18; filter: blur(6px); transition: transform .5s var(--ease), opacity .3s;
}
.module:hover { transform: translateY(-4px); border-color: var(--glow); box-shadow: 0 14px 34px rgba(0, 0, 0, .4); }
.module:hover::after { transform: scale(1.5); opacity: .3; }
.module .m-emoji { font-size: 2rem; align-self: flex-start; transition: transform .35s var(--ease); }
.module:hover .m-emoji { transform: scale(1.15) rotate(-6deg); }
.module h3 { margin: auto 0 0; font-size: 1.15rem; }
.module p { margin: 0; font-size: .85rem; color: var(--muted); }

/* =====================================================================
   5. WEAKPOINT
   ===================================================================== */
.subj-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 18px; }
.subj {
  text-align: left; cursor: pointer; padding: 16px; border-radius: var(--radius); background: var(--card);
  border: 1px solid var(--line); transition: transform .25s var(--ease), border-color .2s;
}
.subj:hover { transform: translateY(-3px); border-color: var(--accent); }
.subj .s-emoji { font-size: 1.7rem; }
.subj b { display: block; margin: 6px 0 2px; font-size: 1.05rem; }
.subj small { color: var(--muted); }

.q-top { display: flex; justify-content: space-between; color: var(--muted); font-size: .85rem; margin-bottom: 8px; }
.question h2 { font-size: 1.2rem; margin: 14px 0 16px; }
.options { display: grid; gap: 8px; }
.option {
  text-align: left; padding: 13px 15px; border-radius: var(--radius-sm); background: var(--bg-2);
  border: 1px solid var(--line); cursor: pointer; transition: all .2s var(--ease);
}
.option:hover { border-color: #3a4260; transform: translateX(3px); }
.option.picked { border-color: var(--accent); background: rgba(139, 123, 255, .14); }

.result-top { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
.ring {
  --p: 0; width: 120px; height: 120px; border-radius: 50%; display: grid; place-items: center; flex: none;
  background: conic-gradient(var(--ring-c, var(--accent)) calc(var(--p) * 1%), var(--bg-2) 0);
}
.ring > div { width: 92px; height: 92px; border-radius: 50%; background: var(--card); display: grid; place-items: center; font-size: 1.7rem; font-weight: 800; }
.mistake { border-left: 3px solid var(--danger); padding: 10px 12px; background: var(--bg-2); border-radius: 0 12px 12px 0; margin-bottom: 10px; }
.mistake p { margin: 4px 0; font-size: .92rem; }
.mistake .bad { color: var(--danger); }
.mistake .good { color: var(--ok); }
.topic-row { margin-bottom: 12px; }
.topic-row .row { justify-content: space-between; font-size: .9rem; margin-bottom: 5px; }
.weak { padding: 12px 14px; border-radius: 14px; background: rgba(255, 179, 71, .08); border: 1px solid rgba(255, 179, 71, .3); margin-bottom: 8px; }
.weak b { color: var(--warn); }
.hist-item { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.hist-item:last-child { border-bottom: 0; }
.pct { font-weight: 800; }
.pct.good { color: var(--ok); } .pct.mid { color: var(--warn); } .pct.bad { color: var(--danger); }

/* =====================================================================
   6. HOMETRY
   ===================================================================== */
.ht-grid { display: grid; gap: 12px; }
.ht-card {
  text-align: left; cursor: pointer; display: flex; gap: 14px; align-items: flex-start; padding: 16px;
  border-radius: var(--radius); background: var(--card); border: 1px solid var(--line);
  transition: transform .25s var(--ease), border-color .2s;
}
.ht-card:hover { transform: translateY(-3px); border-color: var(--accent-2); }
.ht-card .ht-emoji { font-size: 2rem; width: 52px; height: 52px; flex: none; display: grid; place-items: center; background: var(--bg-2); border-radius: 14px; }
.ht-card b { display: block; font-size: 1.05rem; }
.ht-card p { margin: 4px 0 8px; font-size: .88rem; color: var(--muted); }
.explain { font-size: 1.02rem; }
.items { display: grid; gap: 8px; margin-top: 10px; }
.item { display: flex; gap: 10px; align-items: flex-start; background: var(--bg-2); border-radius: 12px; padding: 10px 12px; font-size: .92rem; }
.item span:first-child { font-size: 1.3rem; }
.need { list-style: none; padding: 0; margin: 0; display: flex; flex-wrap: wrap; gap: 6px; }
.steps { counter-reset: s; list-style: none; padding: 0; margin: 0; }
.steps li { counter-increment: s; position: relative; padding: 0 0 12px 40px; }
.steps li::before {
  content: counter(s); position: absolute; left: 0; top: 0; width: 28px; height: 28px; border-radius: 50%;
  display: grid; place-items: center; background: var(--card-2); border: 1px solid var(--line); font-weight: 700; font-size: .85rem;
}
.conclusion { background: linear-gradient(135deg, rgba(94, 231, 223, .12), rgba(139, 123, 255, .12)); border: 1px solid rgba(94, 231, 223, .3); border-radius: 16px; padding: 14px 16px; }
.safety { font-size: .85rem; color: var(--warn); margin-top: 10px; }

/* =====================================================================
   7. TASKPLANNER
   ===================================================================== */
.form-grid { display: grid; gap: 0 12px; }
.task {
  display: flex; gap: 12px; align-items: flex-start; padding: 14px; margin-bottom: 10px;
  background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--line);
  border-radius: 16px; transition: transform .2s var(--ease), opacity .3s, border-color .2s;
  animation: viewIn .35s var(--ease);
}
.task:hover { transform: translateX(2px); }
.task.overdue { border-left-color: var(--danger); background: linear-gradient(90deg, rgba(255, 92, 122, .08), var(--card) 40%); }
.task.urgent { border-left-color: var(--warn); background: linear-gradient(90deg, rgba(255, 179, 71, .08), var(--card) 40%); }
.task.done { opacity: .55; border-left-color: var(--ok); }
.task.done .t-title { text-decoration: line-through; }
.check {
  width: 26px; height: 26px; flex: none; border-radius: 8px; border: 2px solid #3a4260; background: transparent;
  cursor: pointer; display: grid; place-items: center; transition: all .2s; color: #0b0d14; font-weight: 900; font-size: .85rem;
}
.check:hover { border-color: var(--ok); }
.task.done .check { background: var(--ok); border-color: var(--ok); }
.t-body { flex: 1; min-width: 0; }
.t-title { font-weight: 700; word-break: break-word; }
.t-meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; font-size: .8rem; }
.t-actions { display: flex; gap: 4px; }
.icon-btn { border: 0; background: transparent; cursor: pointer; padding: 6px; border-radius: 8px; font-size: 1rem; transition: background .2s; }
.icon-btn:hover { background: var(--card-2); }
.prio-high { color: var(--danger); border-color: rgba(255, 92, 122, .4); }
.prio-medium { color: var(--warn); border-color: rgba(255, 179, 71, .4); }
.prio-low { color: var(--ok); border-color: rgba(61, 220, 151, .4); }
.deadline.overdue { color: var(--danger); border-color: rgba(255, 92, 122, .5); }
.deadline.urgent { color: var(--warn); border-color: rgba(255, 179, 71, .5); }

/* =====================================================================
   8. TEAMSYNC
   ===================================================================== */
.tabs { display: flex; gap: 6px; margin-bottom: 14px; overflow-x: auto; }
.tabs button { flex: none; border: 1px solid var(--line); background: var(--card); padding: 9px 14px; border-radius: 999px; cursor: pointer; font-weight: 600; color: var(--muted); transition: all .2s; }
.tabs button.active { color: var(--text); border-color: var(--accent); background: rgba(139, 123, 255, .14); }
.tabs button span { font-size: .75rem; background: var(--card-2); padding: 1px 7px; border-radius: 999px; margin-left: 4px; }
.people { display: grid; gap: 12px; }
.person {
  display: flex; flex-direction: column; gap: 8px; padding: 16px; border-radius: var(--radius);
  background: var(--card); border: 1px solid var(--line); transition: transform .25s var(--ease), border-color .2s;
  animation: viewIn .35s var(--ease);
}
.person:hover { transform: translateY(-3px); border-color: #3a4260; }
.person.mine { border-color: rgba(94, 231, 223, .45); }
.p-head { display: flex; align-items: center; gap: 12px; }
.avatar { width: 46px; height: 46px; flex: none; border-radius: 14px; display: grid; place-items: center; font-weight: 800; font-size: 1.1rem; color: #0b0d14; }
.p-head b { display: block; }
.p-head small { color: var(--muted); }
.person p { margin: 0; font-size: .9rem; }
.person .label { color: var(--muted); font-size: .78rem; font-weight: 600; }
.person .btn { margin-top: auto; }
.in-team { background: rgba(61, 220, 151, .12); border-color: rgba(61, 220, 151, .5); color: var(--ok); }

/* =====================================================================
   9. АДАПТИВНОСТЬ
   ===================================================================== */
@media (min-width: 720px) {
  main { padding-top: 32px; }
  .top-nav { display: flex; }
  .module { min-height: 190px; padding: 24px; }
  .module .m-emoji { font-size: 2.6rem; }
  .module h3 { font-size: 1.35rem; }
  .module p { font-size: .95rem; }
  .stat b { font-size: 1.9rem; }
  .ht-grid, .people { grid-template-columns: repeat(2, 1fr); }
  .form-grid { grid-template-columns: 2fr 1fr; }
  .subj-grid { grid-template-columns: repeat(4, 1fr); }
}
@media (min-width: 1000px) {
  .people { grid-template-columns: repeat(3, 1fr); }
  .two-col { display: grid; grid-template-columns: 1.2fr 1fr; gap: 16px; align-items: start; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>

<!-- ================= ШАПКА ================= -->
<header class="topbar">
  <div class="wrap">
    <a class="logo" href="#/" aria-label="NOVA — на главную">
      <b><span>✦</span> NOVA</b>
      <small>SMART STUDENT PLATFORM</small>
    </a>
    <nav class="top-nav" aria-label="Модули">
      <a href="#/weakpoint" data-nav="weakpoint">🧠 WeakPoint</a>
      <a href="#/hometry" data-nav="hometry">🔍 HomeTry</a>
      <a href="#/tasks" data-nav="tasks">📅 TaskPlanner</a>
      <a href="#/team" data-nav="team">🤝 TeamSync</a>
    </nav>
  </div>
</header>

<main class="wrap"><div id="app"></div></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";

/* =====================================================================
   1. ХРАНИЛИЩЕ (localStorage) И УТИЛИТЫ
   ===================================================================== */
const store = {
  get(key, fallback) {
    try { const v = localStorage.getItem("nova." + key); return v === null ? fallback : JSON.parse(v); }
    catch (e) { return fallback; }
  },
  set(key, value) {
    try { localStorage.setItem("nova." + key, JSON.stringify(value)); }
    catch (e) { toast("Не удалось сохранить: память браузера недоступна"); }
  }
};

const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];
/** Экранирование текста перед вставкой в HTML (защита от «поломки» вёрстки). */
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pctClass = p => (p >= 80 ? "good" : p >= 50 ? "mid" : "bad");
const fmtDate = iso => new Date(iso).toLocaleString("ru-RU", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });

function toast(msg) {
  const t = $("#toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => t.classList.remove("show"), 2400);
}

/** Шапка модуля с кнопкой «Назад». */
function modHead(emoji, title, subtitle, backHref = "#/") {
  return `<div class="mod-head">
      <a class="back" href="${backHref}" aria-label="Назад">←</a>
      <div><h1>${emoji} ${title}</h1><p>${subtitle}</p></div>
    </div>`;
}

function emptyState(icon, title, hint) {
  return `<div class="empty"><span class="e-icon">${icon}</span><b>${title}</b>${hint}</div>`;
}

/* =====================================================================
   2. ДАННЫЕ: ВОПРОСЫ WEAKPOINT
   Формат: { t: тема, q: вопрос, o: [варианты], a: индекс верного, e: пояснение }
   ===================================================================== */

/** Сводка по темам предмета за всю историю прохождений. */
function topicStats(subjectId) {
  const stats = {};
  store.get("tests", []).filter(h => h.subject === subjectId).forEach(h => {
    Object.entries(h.topics).forEach(([topic, v]) => {
      stats[topic] = stats[topic] || { right: 0, total: 0 };
      stats[topic].right += v.right;
      stats[topic].total += v.total;
    });
  });
  return stats;
}

function weakTopicsHtml(stats) {
  const weak = Object.entries(stats)
    .map(([topic, v]) => ({ topic, p: Math.round(v.right / v.total * 100) }))
    .filter(x => x.p < 70)
    .sort((a, b) => a.p - b.p);
  if (!weak.length) return `<p class="muted">Слабых тем не найдено — все темы выше 70%. Так держать! 🎉</p>`;
  return weak.map(w => `
    <div class="weak"><b>${esc(w.topic)} — ${w.p}%</b><br><span class="small">📌 ${esc(TOPIC_TIPS[w.topic] || "Повтори теорию и реши ещё несколько задач по этой теме.")}</span></div>`).join("");
}

function startQuiz(subjectId) {
  // Перемешиваем вопросы и варианты, запоминая, где правильный ответ
  const questions = shuffle(SUBJECTS[subjectId].questions).map(q => {
    const order = shuffle(q.o.map((_, i) => i));
    return { ...q, o: order.map(i => q.o[i]), a: order.indexOf(q.a) };
  });
  quiz = { subject: subjectId, questions, answers: Array(questions.length).fill(null), i: 0 };
  router();
}

function renderQuestion(view) {
  const q = quiz.questions[quiz.i];
  const total = quiz.questions.length;
  const s = SUBJECTS[quiz.subject];
  view.innerHTML = `
    <div class="mod-head">
      <a class="back" href="#/weakpoint" id="quitQuiz" aria-label="Выйти из теста">←</a>
      <div><h1>${s.emoji} ${s.name}</h1><p>Тема: ${esc(q.t)}</p></div>
    </div>
    <section class="card question">
      <div class="q-top"><span>Вопрос ${quiz.i + 1} из ${total}</span><span>${quiz.answers.filter(a => a !== null).length} отвечено</span></div>
      <div class="progress"><i style="width:${(quiz.i / total) * 100}%"></i></div>
      <h2>${esc(q.q)}</h2>
      <div class="options">
        ${q.o.map((opt, k) => `<button class="option ${quiz.answers[quiz.i] === k ? "picked" : ""}" data-k="${k}">${esc(opt)}</button>`).join("")}
      </div>
      <div class="row between" style="margin-top:16px">
        <button class="btn btn-ghost" id="prevQ" ${quiz.i === 0 ? "disabled" : ""}>← Назад</button>
        <button class="btn btn-primary" id="nextQ" ${quiz.answers[quiz.i] === null ? "disabled" : ""}>${quiz.i === total - 1 ? "Завершить тест" : "Далее →"}</button>
      </div>
    </section>`;

  $("#quitQuiz", view).onclick = e => {
    e.preventDefault();
    if (confirm("Выйти из теста? Прогресс не сохранится.")) { quiz = null; router(); }
  };
  $$(".option", view).forEach(b => b.onclick = () => { quiz.answers[quiz.i] = +b.dataset.k; renderQuestion(view); });
  $("#prevQ", view).onclick = () => { quiz.i--; renderQuestion(view); };
  $("#nextQ", view).onclick = () => {
    if (quiz.i < total - 1) { quiz.i++; renderQuestion(view); }
    else finishQuiz();
  };
}

function finishQuiz() {
  const topics = {};
  let score = 0;
  quiz.questions.forEach((q, i) => {
    const right = quiz.answers[i] === q.a;
    if (right) score++;
    topics[q.t] = topics[q.t] || { right: 0, total: 0 };
    topics[q.t].total++;
    if (right) topics[q.t].right++;
  });
  const total = quiz.questions.length;
  const record = { id: uid(), subject: quiz.subject, date: new Date().toISOString(), score, total, percent: Math.round(score / total * 100), topics };
  store.set("tests", [record, ...store.get("tests", [])].slice(0, 100));
  quiz.finished = true;
  quiz.record = record;
  router();
}

          <div class="mistake">

      </section>
      <section class="card">
        <h3>📊 По темам в этом тесте</h3>
        ${Object.entries(record.topics).map(([t, v]) => {

        }).join("")}
        <h3 style="margin-top:18px">🎯 Что повторить</h3>
        ${weakTopicsHtml(record.topics)}
      </section>
    </div>`;

  $(".back", view).onclick = e => { e.preventDefault(); quiz = null; router(); };

        <p class="small muted" style="margin:16px 0 10px">Шаги:</p>
        <ol class="steps">${t.steps.map(s => `<li>${esc(s)}</li>`).join("")}</ol>
        ${t.safety ? `<p class="safety">⚠️ ${esc(t.safety)}</p>` : ""}
      </section>
      <section class="card">
        <h3>✅ Вывод</h3>
        <div class="conclusion">${esc(t.conclusion)}</div>
        <p class="small muted" style="margin-top:14px">Хочешь проверить знания? Пройди тест в WeakPoint.</p>
        <a class="btn btn-block" href="#/weakpoint">🧠 Перейти к тестам</a>
      </section>
    </div>`;
}

/* =====================================================================
   9. МОДУЛЬ TASKPLANNER
   ===================================================================== */
const PRIORITY = { high: "Высокий", medium: "Средний", low: "Низкий" };
const PRIORITY_RANK = { high: 0, medium: 1, low: 2 };
let taskFilter = "all";
let editingTaskId = null;

/** Статус по дедлайну: overdue — просрочено, urgent — меньше суток. */
function deadlineStatus(task) {
  if (task.done || !task.deadline) return "";
  const diff = new Date(task.deadline) - Date.now();
  if (diff < 0) return "overdue";
  if (diff < 24 * 60 * 60 * 1000) return "urgent";
  return "";
}

function deadlineLabel(task) {
  if (!task.deadline) return "без дедлайна";
  const st = deadlineStatus(task);
  const when = fmtDate(task.deadline);
  if (st === "overdue") return "⛔ просрочено · " + when;
  if (st === "urgent") {
    const h = Math.max(1, Math.round((new Date(task.deadline) - Date.now()) / 3600000));
    return `🔥 через ${h} ч · ${when}`;
  }
  return "⏰ " + when;
}

function renderTasks(view) {
  const tasks = store.get("tasks", []);
  const editing = tasks.find(t => t.id === editingTaskId);
  const doneCount = tasks.filter(t => t.done).length;
  const percent = tasks.length ? Math.round(doneCount / tasks.length * 100) : 0;

  view.innerHTML = `
    ${modHead("📅", "TaskPlanner", "Задания, дедлайны и приоритеты")}
    <div class="two-col">
      <section class="card">
        <h3>${editing ? "✏️ Редактировать задачу" : "➕ Новая задача"}</h3>
        <form id="taskForm" autocomplete="off">
          <label class="field"><span>Название *</span><input type="text" name="title" required maxlength="120" placeholder="Например: Реферат по истории" value="${esc(editing?.title)}"></label>
          <div class="form-grid">
            <label class="field"><span>Предмет</span><input type="text" name="subject" maxlength="40" placeholder="История" value="${esc(editing?.subject)}" list="subjList"></label>
            <label class="field"><span>Приоритет</span>
              <select name="priority">${Object.entries(PRIORITY).map(([k, v]) => `<option value="${k}" ${(editing?.priority || "medium") === k ? "selected" : ""}>${v}</option>`).join("")}</select>
            </label>
          </div>
          <label class="field"><span>Дедлайн</span><input type="datetime-local" name="deadline" value="${esc(editing?.deadline)}"></label>
          <datalist id="subjList">${["Математика", "Физика", "История", "Английский", "Химия", "Биология", "Литература", "Информатика"].map(s => `<option value="${s}">`).join("")}</datalist>
          <div class="row">
            <button class="btn btn-primary" type="submit">${editing ? "Сохранить" : "Добавить задачу"}</button>
            ${editing ? `<button class="btn btn-ghost" type="button" id="cancelEdit">Отмена</button>` : ""}
          </div>
        </form>
      </section>

      <section class="card">
        <div class="row between"><h3 style="margin:0">📈 Прогресс</h3><b>${doneCount} из ${tasks.length}</b></div>
        <div class="progress" style="margin:12px 0 8px"><i style="width:${percent}%"></i></div>
        <p class="small muted">${tasks.length ? `Выполнено ${percent}% · активных: ${tasks.length - doneCount}` : "Добавь задачи, чтобы видеть прогресс."}</p>
        <div class="row small" style="gap:6px">
          <span class="chip deadline overdue">⛔ просрочено</span>
          <span class="chip deadline urgent">🔥 меньше суток</span>
        </div>
      </section>
    </div>

    <div class="row between" style="margin:4px 0 14px">
      <div class="seg" role="tablist" aria-label="Фильтр задач">
        ${[["all", "Все"], ["active", "Активные"], ["done", "Выполненные"]].map(([k, v]) => `<button data-filter="${k}" class="${taskFilter === k ? "active" : ""}">${v}</button>`).join("")}
      </div>
      <span class="small muted">Сортировка: по дедлайну</span>
    </div>
    <div id="taskList"></div>`;

  // Список: фильтр + сортировка по дедлайну (без дедлайна — в конце), затем по приоритету
  const list = tasks
    .filter(t => taskFilter === "all" || (taskFilter === "active" ? !t.done : t.done))
    .sort((a, b) => {
      if (a.done !== b.done) return a.done ? 1 : -1;
      const da = a.deadline ? new Date(a.deadline).getTime() : Infinity;
      const db = b.deadline ? new Date(b.deadline).getTime() : Infinity;
      return da - db || PRIORITY_RANK[a.priority] - PRIORITY_RANK[b.priority];
    });

  const box = $("#taskList", view);
  if (!tasks.length) {
    box.innerHTML = emptyState("🗒️", "Задач пока нет", "Заполни форму выше: название, предмет, дедлайн и приоритет.");
  } else if (!list.length) {
    box.innerHTML = emptyState(taskFilter === "done" ? "⏳" : "🎉", taskFilter === "done" ? "Выполненных задач пока нет" : "Все задачи выполнены!", taskFilter === "done" ? "Отметь задачу галочкой, когда закончишь её." : "Отличная работа. Добавь новую задачу, когда понадобится.");
  } else {
    box.innerHTML = list.map(t => {
      const st = deadlineStatus(t);
      return `
        <article class="task ${t.done ? "done" : ""} ${st}">
          <button class="check" data-toggle="${t.id}" aria-label="${t.done ? "Вернуть в активные" : "Отметить выполненной"}">${t.done ? "✓" : ""}</button>
          <div class="t-body">
            <div class="t-title">${esc(t.title)}</div>
            <div class="t-meta">
              ${t.subject ? `<span class="chip">📚 ${esc(t.subject)}</span>` : ""}
              <span class="chip prio-${t.priority}">● ${PRIORITY[t.priority]}</span>
              <span class="chip deadline ${st}">${deadlineLabel(t)}</span>
            </div>
          </div>
          <div class="t-actions">
            <button class="icon-btn" data-edit="${t.id}" aria-label="Редактировать">✏️</button>
            <button class="icon-btn" data-del="${t.id}" aria-label="Удалить">🗑️</button>
          </div>
        </article>`;
    }).join("");
  }

  // --- обработчики ---
  $("#taskForm", view).onsubmit = e => {
    e.preventDefault();
    const f = new FormData(e.target);
    const data = {
      title: f.get("title").trim(),
      subject: f.get("subject").trim(),
      priority: f.get("priority"),
      deadline: f.get("deadline")
    };
    if (!data.title) return toast("Введи название задачи");
    let all = store.get("tasks", []);
    if (editingTaskId) {
      all = all.map(t => t.id === editingTaskId ? { ...t, ...data } : t);
      toast("Задача обновлена ✓");
    } else {
      all.push({ id: uid(), done: false, created: new Date().toISOString(), ...data });
      toast("Задача добавлена ✓");
    }
    editingTaskId = null;
    store.set("tasks", all);
    renderTasks(view);
  };
  const cancel = $("#cancelEdit", view);
  if (cancel) cancel.onclick = () => { editingTaskId = null; renderTasks(view); };

  $$("[data-filter]", view).forEach(b => b.onclick = () => { taskFilter = b.dataset.filter; renderTasks(view); });
  $$("[data-toggle]", view).forEach(b => b.onclick = () => {
    store.set("tasks", store.get("tasks", []).map(t => t.id === b.dataset.toggle ? { ...t, done: !t.done } : t));
    renderTasks(view);
  });
  $$("[data-edit]", view).forEach(b => b.onclick = () => { editingTaskId = b.dataset.edit; renderTasks(view); window.scrollTo({ top: 0, behavior: "smooth" }); });
  $$("[data-del]", view).forEach(b => b.onclick = () => {
    if (!confirm("Удалить задачу?")) return;
    if (editingTaskId === b.dataset.del) editingTaskId = null;
    store.set("tasks", store.get("tasks", []).filter(t => t.id !== b.dataset.del));
    toast("Задача удалена");
    renderTasks(view);
  });
}

/* =====================================================================
   10. МОДУЛЬ TEAMSYNC
   ===================================================================== */
let teamTab = "feed";
let teamQuery = "";
let teamSkill = "";

/** Все анкеты: моя (если есть) + демо. */
function allPeople() {
  const mine = store.get("myProfile", null);
  return mine ? [{ ...mine, mine: true }, ...DEMO_PEOPLE] : DEMO_PEOPLE;
}

function avatar(person, i) {
  const color = AVATAR_COLORS[i % AVATAR_COLORS.length];
  return `<span class="avatar" style="background:${color}">${esc(person.name.trim().charAt(0).toUpperCase() || "?")}</span>`;
}

function personCard(p, i, team) {
  const inTeam = team.includes(p.id);
  return `
    <article class="person ${p.mine ? "mine" : ""}">
      <div class="p-head">${avatar(p, i)}<div><b>${esc(p.name)}</b><small>${p.mine ? "Это ты" : esc(p.skills.slice(0, 2).join(" · "))}</small></div></div>
      <div class="chips">${p.skills.map(s => `<span class="chip">${esc(s)}</span>`).join("")}</div>
      <p><span class="label">Интересы:</span> ${esc(p.interests)}</p>
      <p><span class="label">Ищу:</span> ${esc(p.looking)}</p>
      ${p.mine
        ? `<button class="btn btn-sm" data-tab="profile">✏️ Редактировать анкету</button>`
        : `<button class="btn btn-sm ${inTeam ? "in-team" : "btn-primary"}" data-join="${p.id}">${inTeam ? "✓ В команде" : "🤝 Хочу в команду"}</button>`}
    </article>`;
}

function renderTeam(view) {
  const team = store.get("team", []);
  const people = allPeople();
  const mine = store.get("myProfile", null);

  let body = "";
  if (teamTab === "feed") {
    const skills = [...new Set(people.flatMap(p => p.skills))].sort((a, b) => a.localeCompare(b, "ru"));
    const q = teamQuery.trim().toLowerCase();
    const list = people.filter(p =>
      (!teamSkill || p.skills.includes(teamSkill)) &&
      (!q || [p.name, p.interests, p.looking, ...p.skills].join(" ").toLowerCase().includes(q)));
    body = `
      <label class="field"><span>Поиск</span><input type="search" id="teamSearch" placeholder="Имя, интерес или навык…" value="${esc(teamQuery)}" autocomplete="off"></label>
      <div class="chips" style="margin-bottom:16px">
        <button class="chip ${!teamSkill ? "active" : ""}" data-skill="">Все навыки</button>
        ${skills.map(s => `<button class="chip ${teamSkill === s ? "active" : ""}" data-skill="${esc(s)}">${esc(s)}</button>`).join("")}
      </div>
      ${list.length
        ? `<div class="people">${list.map((p, i) => personCard(p, people.indexOf(p), team)).join("")}</div>`
        : emptyState("🔍", "Никого не нашли", "Измени запрос или выбери «Все навыки».")}`;
  } else if (teamTab === "team") {
    const members = people.filter(p => team.includes(p.id));
    body = members.length
      ? `<div class="people">${members.map(p => personCard(p, people.indexOf(p), team)).join("")}</div>`
      : emptyState("🤝", "В твоей команде пока никого", "Открой «Ленту анкет» и нажми «Хочу в команду» у тех, с кем хочешь работать.");
  } else {
    body = `
      <section class="card">
        <h3>${mine ? "✏️ Моя анкета" : "📝 Создай анкету"}</h3>
        <p class="small muted">Анкета появится в ленте, и другие увидят, чем ты можешь помочь.</p>
        <form id="profileForm" autocomplete="off">
          <label class="field"><span>Имя *</span><input type="text" name="name" required maxlength="40" value="${esc(mine?.name)}" placeholder="Как тебя зовут"></label>
          <label class="field"><span>Навыки * (через запятую)</span><input type="text" name="skills" required maxlength="160" value="${esc(mine?.skills.join(", "))}" placeholder="JavaScript, Дизайн, Презентации"></label>
          <label class="field"><span>Интересы</span><textarea name="interests" maxlength="200" placeholder="Что тебе интересно">${esc(mine?.interests)}</textarea></label>
          <label class="field"><span>Кого ищу</span><textarea name="looking" maxlength="200" placeholder="Кто нужен тебе в команду">${esc(mine?.looking)}</textarea></label>
          <div class="row">
            <button class="btn btn-primary" type="submit">${mine ? "Сохранить" : "Опубликовать анкету"}</button>
            ${mine ? `<button class="btn btn-ghost btn-danger" type="button" id="delProfile">Удалить анкету</button>` : ""}
          </div>
        </form>
      </section>`;
  }

  view.innerHTML = `
    ${modHead("🤝", "TeamSync", "Найди людей для проекта, олимпиады или хакатона")}
    <div class="tabs" role="tablist">
      <button class="${teamTab === "feed" ? "active" : ""}" data-tab="feed">Лента анкет <span>${people.length}</span></button>
      <button class="${teamTab === "team" ? "active" : ""}" data-tab="team">Моя команда <span>${team.length}</span></button>
      <button class="${teamTab === "profile" ? "active" : ""}" data-tab="profile">${mine ? "Моя анкета" : "+ Создать анкету"}</button>
    </div>
    ${body}`;

  // --- обработчики ---
  $$("[data-tab]", view).forEach(b => b.onclick = () => { teamTab = b.dataset.tab; renderTeam(view); });
  $$("[data-skill]", view).forEach(b => b.onclick = () => { teamSkill = b.dataset.skill; renderTeam(view); });
  const search = $("#teamSearch", view);
  if (search) search.oninput = e => {
    teamQuery = e.target.value;
    const pos = e.target.selectionStart;
    renderTeam(view);
    const s = $("#teamSearch", view); s.focus(); s.setSelectionRange(pos, pos);
  };
  $$("[data-join]", view).forEach(b => b.onclick = () => {
    const id = b.dataset.join;
    const cur = store.get("team", []);
    const name = people.find(p => p.id === id)?.name;
    if (cur.includes(id)) { store.set("team", cur.filter(x => x !== id)); toast(`${name} убран(а) из команды`); }
    else { store.set("team", [...cur, id]); toast(`${name} добавлен(а) в команду 🤝`); }
    renderTeam(view);
  });
  const form = $("#profileForm", view);
  if (form) form.onsubmit = e => {
    e.preventDefault();
    const f = new FormData(form);
    const skills = f.get("skills").split(",").map(s => s.trim()).filter(Boolean);
    if (!f.get("name").trim() || !skills.length) return toast("Заполни имя и хотя бы один навык");
    store.set("myProfile", {
      id: "me", name: f.get("name").trim(), skills,
      interests: f.get("interests").trim() || "—", looking: f.get("looking").trim() || "—"
    });
    toast("Анкета сохранена ✓");
    teamTab = "feed";
    renderTeam(view);
  };
  const del = $("#delProfile", view);
  if (del) del.onclick = () => {
    if (!confirm("Удалить твою анкету?")) return;
    store.set("myProfile", null);
    teamTab = "feed";
    renderTeam(view);
  };
}

router();
